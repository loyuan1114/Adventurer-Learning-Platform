<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adv9 分享筆記</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--mut:#8b949e;--line:#30363d;--gold:#e0b253;--teal:#1f9e8f}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.3)}
  header .logo{font-size:19px;font-weight:900;color:var(--gold)}
  main{max-width:760px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px;line-height:1.9}
  .vt{font-size:22px;font-weight:900;margin:0 0 6px;color:var(--gold)}
  .meta{font-size:12px;color:var(--mut);margin-bottom:14px}
  .sec{margin-top:16px}
  .sec h4{color:var(--teal);margin:0 0 8px}
  ol,ul{margin:6px 0 0 20px}
  .tag{display:inline-block;background:rgba(61,90,254,.2);border:1px solid rgba(61,90,254,.4);border-radius:20px;padding:2px 10px;font-size:11px;margin:2px}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;background:var(--gold);color:#111;font-weight:700}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .err{padding:40px;text-align:center;color:#ff6b6b}
  .hidden{display:none}
</style>
</head>
<body>
<header><span class="logo">📒 adv9 分享筆記</span><span style="font-size:12px;color:var(--mut)">由好友分享的學習筆記</span></header>
<main id="main">
  <div class="err" id="loading">載入中…</div>
</main>
<script>
function parseShare(){
  const h=location.hash||'';
  if(!h||h.length<20){document.getElementById('loading').textContent='❌ 連結無效：缺少筆記內容';return}
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(h.slice(1)))));
    if(!(data&&data.t==='adv9note'&&data.content)){document.getElementById('loading').textContent='❌ 連結格式錯誤';return}
    render(data);
  }catch(e){document.getElementById('loading').textContent='❌ 無法解析筆記內容';}
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function render(d){
  const main=document.getElementById('main');
  let h='<div class="card"><div class="vt">'+esc(d.title||'未命名筆記')+'</div>'+
  '<div class="meta">來源：'+(d.sourceType||'text')+'　分享時間：'+new Date().toLocaleString()+(d.tags&&d.tags.length?'<br>'+d.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join(' '):'')+'</div>'+
  (d.summary?'<div class="sec"><h4>📌 摘要</h4><div>'+esc(d.summary)+'</div></div>':'')+
  '<div class="sec"><h4>📖 內容</h4><div>'+esc(d.content||'').replace(/\n/g,'<br>')+'</div></div>'+
  (d.outline&&d.outline.length?'<div class="sec"><h4>📑 大綱</h4><ol>'+d.outline.map(esc).map(x=>'<li>'+x+'</li>').join('')+'</ol></div>':'')+
  (d.definitions&&d.definitions.length?'<div class="sec"><h4>📖 定義</h4><div>'+d.definitions.map(x=>'<div><b>'+esc(x.t||'')+'</b>：'+esc(x.d||'')+'</div>').join('')+'</div></div>':'')+
  '</div><button class="btn ghost" onclick="window.print()">🖨️ 列印 / 存 PDF</button>';
  main.innerHTML=h;
}
parseShare();
</script>
</body>
</html>
