<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎀 娃娃物語</title>
<style>
  :root {
    --bg: #1a0a2e;
    --panel: #2d1b4e;
    --panel2: #231538;
    --line: #4a3070;
    --gold: #f2c14e;
    --pink: #ff6b9d;
    --pink2: #ff9ec4;
    --txt: #f0e6ff;
    --mut: #9a8bb5;
    --green: #7ed957;
    --red: #ef5350;
    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    color: var(--txt);
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #2d1b4e 0%, #1a0a2e 60%, #0d0518 100%);
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* 導航列 */
  .nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: rgba(26, 10, 46, 0.95);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(10px);
  }
  .nav-brand {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 20px;
    color: var(--pink2);
    text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
  }
  .nav-actions { display: flex; gap: 10px; }
  .btn {
    font-family: var(--sans);
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--pink), #d63384);
    color: white;
    box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
  }
  .btn-secondary {
    background: var(--panel2);
    color: var(--txt);
    border: 1px solid var(--line);
  }
  .btn-secondary:hover { background: var(--line); }
  .btn-danger {
    background: linear-gradient(135deg, #ef5350, #c62828);
    color: white;
  }
  .btn-small { padding: 5px 12px; font-size: 12px; }

  /* 主容器 */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  /* 娃娃列表 */
  .doll-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .doll-card {
    background: linear-gradient(145deg, var(--panel), var(--panel2));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    transition: all 0.3s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .doll-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--pink), var(--gold));
    opacity: 0.7;
  }
  .doll-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(255, 107, 157, 0.2);
    border-color: var(--pink);
  }
  .doll-card.ssr::before { background: linear-gradient(90deg, #ffd700, #ff6b9d, #9d4edd); }
  .doll-card.ur::before { background: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00ff88, #00bfff, #4b0082); }

  .doll-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .doll-avatar {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3d2060, #2d1b4e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    border: 2px solid var(--line);
  }
  .doll-info h3 {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--pink2);
    margin-bottom: 4px;
  }
  .doll-meta {
    font-size: 11px;
    color: var(--mut);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .doll-meta span {
    background: rgba(0,0,0,0.3);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .rarity-tag {
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
  }
  .rarity-R { background: #6b7280; color: white; }
  .rarity-SR { background: #3b82f6; color: white; }
  .rarity-SSR { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; }
  .rarity-UR { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; }

  .doll-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .stat-bar {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--mut);
    display: flex;
    justify-content: space-between;
  }
  .stat-track {
    height: 6px;
    background: rgba(0,0,0,0.4);
    border-radius: 3px;
    overflow: hidden;
  }
  .stat-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .stat-fill.warmth { background: linear-gradient(90deg, #ff6b9d, #ff9ec4); }
  .stat-fill.openness { background: linear-gradient(90deg, #9d4edd, #c77dff); }
  .stat-fill.responsibility { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .stat-fill.assertiveness { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

  .bond-bar {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .bond-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 6px;
    color: var(--mut);
  }
  .bond-label b { color: var(--pink2); }

  /* 互動面板 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 5, 20, 0.9);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(145deg, var(--panel), var(--panel2));
    border: 1px solid var(--pink);
    border-radius: 20px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalIn 0.3s ease;
    box-shadow: 0 0 60px rgba(255, 107, 157, 0.3);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    padding: 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 {
    font-family: var(--serif);
    color: var(--pink2);
    font-size: 18px;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--mut);
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--pink); }
  .modal-body { padding: 20px; }

  /* 互動按鈕 */
  .interact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .interact-btn {
    background: linear-gradient(145deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 12px;
    color: var(--txt);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .interact-btn:hover {
    border-color: var(--pink);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2);
  }
  .interact-btn .icon { font-size: 28px; margin-bottom: 6px; }
  .interact-btn .label { font-size: 12px; font-weight: 700; }

  /* 對話區 */
  .chat-area {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    min-height: 150px;
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .chat-msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg.doll {
    background: linear-gradient(135deg, rgba(255, 107, 157, 0.15), rgba(157, 78, 221, 0.15));
    border-left: 3px solid var(--pink);
  }
  .chat-msg.user {
    background: rgba(0,0,0,0.3);
    border-left: 3px solid var(--gold);
    text-align: right;
  }
  .chat-msg .time {
    font-size: 10px;
    color: var(--mut);
    margin-top: 4px;
  }

  /* 輸入區 */
  .input-area {
    display: flex;
    gap: 10px;
  }
  .input-area input {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--txt);
    font-family: var(--sans);
    font-size: 14px;
  }
  .input-area input:focus {
    outline: none;
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.2);
  }

  /* 食物選擇 */
  .food-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .food-btn {
    background: linear-gradient(145deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    color: var(--txt);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .food-btn:hover {
    border-color: var(--gold);
    transform: scale(1.05);
  }
  .food-btn .icon { font-size: 24px; display: block; margin-bottom: 6px; }
  .food-btn .name { font-size: 12px; font-weight: 700; }

  /* 歷史紀錄 */
  .history-list {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .history-title {
    font-size: 12px;
    color: var(--mut);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 12px;
    color: var(--mut);
    border-bottom: 1px solid rgba(74, 48, 112, 0.3);
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .h-icon { font-size: 16px; }
  .history-item .h-type { color: var(--pink2); font-weight: 700; }

  /* 建立娃娃表單 */
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--mut);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--txt);
    font-family: var(--sans);
    font-size: 14px;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.2);
  }
  .mbti-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .mbti-btn {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 6px;
    color: var(--txt);
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.2s;
    text-align: center;
  }
  .mbti-btn:hover, .mbti-btn.selected {
    border-color: var(--pink);
    background: rgba(255, 107, 157, 0.2);
    color: var(--pink2);
  }
  .mbti-btn .mbti-name {
    font-size: 9px;
    color: var(--mut);
    display: block;
    margin-top: 2px;
  }

  /* 商店 */
  .shop-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .shop-title {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .shop-item {
    background: linear-gradient(145deg, var(--panel), var(--panel2));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .shop-item:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(242, 193, 78, 0.2);
  }
  .shop-item .s-icon { font-size: 32px; margin-bottom: 6px; }
  .shop-item .s-name { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .shop-item .s-price { font-size: 11px; color: var(--gold); }

  /* 空狀態 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--mut);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-family: var(--serif); color: var(--pink2); margin-bottom: 8px; }

  /* 通知 */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--panel);
    border: 1px solid var(--pink);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 700;
    z-index: 1000;
    transition: transform 0.3s ease;
    box-shadow: 0 4px 20px rgba(255, 107, 157, 0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<!-- 導航列 -->
<nav class="nav">
  <div class="nav-brand">🎀 娃娃物語</div>
  <div class="nav-actions">
    <button class="btn btn-secondary btn-small" onclick="location.href='index.html'">← 返回遊戲</button>
    <button class="btn btn-primary btn-small" onclick="showCreateModal()">+ 新建娃娃</button>
  </div>
</nav>

<!-- 主容器 -->
<div class="container">
  <h1 style="font-family:var(--serif);font-size:22px;color:var(--pink2);margin-bottom:6px;">我的娃娃夥伴</h1>
  <p style="color:var(--mut);font-size:13px;margin-bottom:20px;">與你的娃娃建立獨特連結，每個互動都會改變她的性格</p>

  <!-- 娃娃列表 -->
  <div id="dollList" class="doll-grid"></div>

  <!-- 商店區 -->
  <div class="shop-section" id="shopSection" style="display:none;">
    <h2 class="shop-title">🛒 娃娃商店</h2>
    <div id="shopGrid" class="shop-grid"></div>
  </div>
</div>

<!-- 互動 Modal -->
<div class="modal-overlay" id="interactModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">互動</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <!-- 互動按鈕 -->
      <div class="interact-grid">
        <button class="interact-btn" onclick="doTalk()">
          <div class="icon">💬</div>
          <div class="label">對話</div>
        </button>
        <button class="interact-btn" onclick="doPet()">
          <div class="icon">🤗</div>
          <div class="label">摸頭</div>
        </button>
        <button class="interact-btn" onclick="showFeedModal()">
          <div class="icon">🍎</div>
          <div class="label">餵食</div>
        </button>
      </div>

      <!-- 對話區 -->
      <div class="chat-area" id="chatArea"></div>

      <!-- 對話輸入 -->
      <div class="input-area" id="talkInput" style="display:none;">
        <input type="text" id="talkText" placeholder="輸入你想對娃娃說的話..." maxlength="100">
        <button class="btn btn-primary" onclick="sendTalk()">發送</button>
      </div>

      <!-- 歷史紀錄 -->
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
</div>

<!-- 建立娃娃 Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-header">
      <h2>🎀 建立新娃娃</h2>
      <button class="modal-close" onclick="closeCreateModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>娃娃名稱</label>
        <input type="text" id="newName" placeholder="給她一個名字..." maxlength="20">
      </div>
      <div class="form-group">
        <label>選擇 MBTI 性格</label>
        <div class="mbti-grid" id="mbtiGrid"></div>
      </div>
      <div class="form-group">
        <label>稀有度</label>
        <select id="newRarity">
          <option value="R">R - 普通</option>
          <option value="SR">SR - 稀有</option>
          <option value="SSR">SSR - 超稀有</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="createDoll()">✨ 創造娃娃</button>
    </div>
  </div>
</div>

<!-- 餵食 Modal -->
<div class="modal-overlay" id="feedModal">
  <div class="modal" style="max-width:360px;">
    <div class="modal-header">
      <h2>🍎 選擇食物</h2>
      <button class="modal-close" onclick="closeFeedModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="food-grid">
        <button class="food-btn" onclick="doFeed('sweet')">
          <span class="icon">🍬</span>
          <span class="name">甜食<br><small style="color:var(--mut)">溫暖↑ 開放↓</small></small>
        </button>
        <button class="food-btn" onclick="doFeed('spicy')">
          <span class="icon">🌶️</span>
          <span class="name">辣食<br><small style="color:var(--mut)">開放↑ 主動↑</small></small>
        </button>
        <button class="food-btn" onclick="doFeed('sour')">
          <span class="icon">🍋</span>
          <span class="name">酸食<br><small style="color:var(--mut)">開放↑↑ 責任↓</small></small>
        </button>
        <button class="food-btn" onclick="doFeed('bitter')">
          <span class="icon">🍵</span>
          <span class="name">苦食<br><small style="color:var(--mut)">責任↑ 溫暖↓</small></small>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
// ─── 狀態 ─────────────────────────────────────────────────────────────────────
let currentUser = null;
let currentDoll = null;
let selectedMbti = 'INFP';

// ─── 初始化 ───────────────────────────────────────────────────────────────────
async function init() {
  // 取得當前用戶（從 localStorage 或主遊戲）
  try {
    const ses = JSON.parse(localStorage.getItem('ADV9_SES') || 'null');
    if (ses && ses.u) {
      const users = JSON.parse(localStorage.getItem('ADV9_USERS') || '[]');
      currentUser = users.find(u => u.username === ses.u);
    }
  } catch(e) {}

  if (!currentUser) {
    currentUser = { id: 'demo_user', username: 'demo', name: '探險家' };
  }

  // 設定 API token
  const token = localStorage.getItem('ADV9_WTOKEN') || '';
  ADV9_DOLL_API.setToken(token);

  // 載入娃娃列表
  await loadDolls();

  // 載入商店
  await loadShop();

  // 初始化 MBTI 選擇格
  initMbtiGrid();
}

// ─── 娃娃列表 ─────────────────────────────────────────────────────────────────
async function loadDolls() {
  const dolls = await ADV9_DOLL_API.getDolls(currentUser.id);
  renderDolls(dolls);
}

function renderDolls(dolls) {
  const container = document.getElementById('dollList');

  if (!dolls || dolls.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="icon">🎀</div>
        <h3>還沒有娃娃夥伴</h3>
        <p>點擊「+ 新建娃娃」開始你的冒險吧！</p>
      </div>
    `;
    return;
  }

  container.innerHTML = dolls.map(d => `
    <div class="doll-card ${d.rarity.toLowerCase()}" onclick="openDoll('${d.id}')">
      <div class="doll-header">
        <div class="doll-avatar">${d.emoji}</div>
        <div class="doll-info">
          <h3>${escHtml(d.name)}</h3>
          <div class="doll-meta">
            <span class="rarity-tag rarity-${d.rarity}">${d.rarity}</span>
            <span>${d.mbti}</span>
            <span>${(MBTI_DESC[d.mbti]||{}).name||''}</span>
          </div>
        </div>
      </div>
      <div class="doll-stats">
        <div class="stat-bar">
          <div class="stat-label"><span>❤️ 溫暖</span><span>${Math.round(d.traits.warmth)}</span></div>
          <div class="stat-track"><div class="stat-fill warmth" style="width:${d.traits.warmth}%"></div></div>
        </div>
        <div class="stat-bar">
          <div class="stat-label"><span>🌟 開放</span><span>${Math.round(d.traits.openness)}</span></div>
          <div class="stat-track"><div class="stat-fill openness" style="width:${d.traits.openness}%"></div></div>
        </div>
        <div class="stat-bar">
          <div class="stat-label"><span>📋 責任</span><span>${Math.round(d.traits.responsibility)}</span></div>
          <div class="stat-track"><div class="stat-fill responsibility" style="width:${d.traits.responsibility}%"></div></div>
        </div>
        <div class="stat-bar">
          <div class="stat-label"><span>⚡ 主動</span><span>${Math.round(d.traits.assertiveness)}</span></div>
          <div class="stat-track"><div class="stat-fill assertiveness" style="width:${d.traits.assertiveness}%"></div></div>
        </div>
      </div>
      <div class="bond-bar">
        <div class="bond-label">
          <span>💕 親密度</span>
          <b>${Math.round(d.bond)}/100</b>
        </div>
        <div class="stat-track">
          <div class="stat-fill warmth" style="width:${d.bond}%;background:linear-gradient(90deg,#ff6b9d,#ff9ec4)"></div>
        </div>
      </div>
      <div style="margin-top:10px;font-size:10px;color:var(--mut);text-align:center;">
        ✨ 印記：${escHtml(d.imprint)}
      </div>
    </div>
  `).join('');
}

// ─── 互動 Modal ────────────────────────────────────────────────────────────────
async function openDoll(dollId) {
  const dolls = await ADV9_DOLL_API.getDolls(currentUser.id);
  currentDoll = dolls.find(d => d.id === dollId);
  if (!currentDoll) return;

  document.getElementById('modalTitle').textContent = currentDoll.name + ' ' + currentDoll.emoji;
  document.getElementById('interactModal').classList.add('active');
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('talkInput').style.display = 'none';
  renderHistory();
}

function closeModal() {
  document.getElementById('interactModal').classList.remove('active');
  currentDoll = null;
}

// ─── 對話 ──────────────────────────────────────────────────────────────────────
function doTalk() {
  document.getElementById('talkInput').style.display = 'flex';
  document.getElementById('talkText').focus();
}

async function sendTalk() {
  const text = document.getElementById('talkText').value.trim();
  if (!text) return;

  // 顯示用戶訊息
  addChatMsg('user', text);
  document.getElementById('talkText').value = '';

  // 呼叫 API
  const result = await ADV9_DOLL_API.interactTalk(currentDoll.id, currentUser.id, text);
  currentDoll = result.doll;

  // 顯示娃娃回應
  addChatMsg('doll', result.response);
  renderHistory();
  updateDollCard();
}

function addChatMsg(type, text) {
  const area = document.getElementById('chatArea');
  const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'chat-msg ' + type;
  div.innerHTML = escHtml(text) + '<div class="time">' + time + '</div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// ─── 摸頭 ─────────────────────────────────────────────────────────────────────
async function doPet() {
  const result = await ADV9_DOLL_API.interactPet(currentDoll.id, currentUser.id);
  currentDoll = result.doll;

  addChatMsg('doll', result.response);
  showToast('💕 親密度 +' + result.bondGain, 'success');
  renderHistory();
  updateDollCard();
}

// ─── 餵食 ─────────────────────────────────────────────────────────────────────
function showFeedModal() {
  document.getElementById('feedModal').classList.add('active');
}

function closeFeedModal() {
  document.getElementById('feedModal').classList.remove('active');
}

async function doFeed(foodType) {
  const result = await ADV9_DOLL_API.interactFeed(currentDoll.id, currentUser.id, foodType);
  currentDoll = result.doll;

  closeFeedModal();
  addChatMsg('doll', result.response);
  showToast('💕 親密度 +' + result.bondGain, 'success');
  renderHistory();
  updateDollCard();
}

// ─── 歷史紀錄 ──────────────────────────────────────────────────────────────────
function renderHistory() {
  const container = document.getElementById('historyList');
  if (!currentDoll || !currentDoll.history || currentDoll.history.length === 0) {
    container.innerHTML = '<div class="history-title">尚無互動紀錄</div>';
    return;
  }

  const iconMap = { talk: '💬', pet: '🤗', feed: '🍎' };
  const typeMap = { talk: '對話', pet: '摸頭', feed: '餵食' };

  container.innerHTML = '<div class="history-title">互動紀錄（最近 10 筆）</div>' +
    currentDoll.history.slice(-10).reverse().map(h => `
      <div class="history-item">
        <span class="h-icon">${iconMap[h.type]||'✨'}</span>
        <span class="h-type">${typeMap[h.type]||h.type}</span>
        <span style="flex:1">${h.response?escHtml(h.response.substring(0,30))+'...':''}</span>
        <span>${new Date(h.time).toLocaleDateString('zh-TW')}</span>
      </div>
    `).join('');
}

function updateDollCard() {
  // 重新渲染當前娃娃卡片
  const cards = document.querySelectorAll('.doll-card');
  cards.forEach(card => {
    if (card.onclick && card.onclick.toString().includes(currentDoll.id)) {
      // 找到對應卡片並更新
      card.innerHTML = buildDollCardHtml(currentDoll);
    }
  });
}

function buildDollCardHtml(d) {
  const info = MBTI_DESC[d.mbti] || {};
  return `
    <div class="doll-header">
      <div class="doll-avatar">${d.emoji}</div>
      <div class="doll-info">
        <h3>${escHtml(d.name)}</h3>
        <div class="doll-meta">
          <span class="rarity-tag rarity-${d.rarity}">${d.rarity}</span>
          <span>${d.mbti}</span>
          <span>${info.name||''}</span>
        </div>
      </div>
    </div>
    <div class="doll-stats">
      <div class="stat-bar">
        <div class="stat-label"><span>❤️ 溫暖</span><span>${Math.round(d.traits.warmth)}</span></div>
        <div class="stat-track"><div class="stat-fill warmth" style="width:${d.traits.warmth}%"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label"><span>🌟 開放</span><span>${Math.round(d.traits.openness)}</span></div>
        <div class="stat-track"><div class="stat-fill openness" style="width:${d.traits.openness}%"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label"><span>📋 責任</span><span>${Math.round(d.traits.responsibility)}</span></div>
        <div class="stat-track"><div class="stat-fill responsibility" style="width:${d.traits.responsibility}%"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label"><span>⚡ 主動</span><span>${Math.round(d.traits.assertiveness)}</span></div>
        <div class="stat-track"><div class="stat-fill assertiveness" style="width:${d.traits.assertiveness}%"></div></div>
      </div>
    </div>
    <div class="bond-bar">
      <div class="bond-label"><span>💕 親密度</span><b>${Math.round(d.bond)}/100</b></div>
      <div class="stat-track"><div class="stat-fill warmth" style="width:${d.bond}%;background:linear-gradient(90deg,#ff6b9d,#ff9ec4)"></div></div>
    </div>
    <div style="margin-top:10px;font-size:10px;color:var(--mut);text-align:center;">✨ 印記：${escHtml(d.imprint)}</div>
  `;
}

// 覆寫 renderDolls 使用新函數
const _origRenderDolls = renderDolls;
renderDolls = async function(dolls) {
  const container = document.getElementById('dollList');
  if (!dolls || dolls.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="icon">🎀</div>
        <h3>還沒有娃娃夥伴</h3>
        <p>點擊「+ 新建娃娃」開始你的冒險吧！</p>
      </div>
    `;
    return;
  }
  container.innerHTML = dolls.map(d => `
    <div class="doll-card ${d.rarity.toLowerCase()}" onclick="openDoll('${d.id}')">
      ${buildDollCardHtml(d)}
    </div>
  `).join('');
};

// ─── 建立娃娃 ──────────────────────────────────────────────────────────────────
function initMbtiGrid() {
  const grid = document.getElementById('mbtiGrid');
  grid.innerHTML = ADV9_DOLL_API.MBTI_TYPES.map(mbti => `
    <button class="mbti-btn ${mbti===selectedMbti?'selected':''}" onclick="selectMbti('${mbti}')">
      ${mbti}
      <span class="mbti-name">${(MBTI_DESC[mbti]||{}).name||''}</span>
    </button>
  `).join('');
}

function selectMbti(mbti) {
  selectedMbti = mbti;
  document.querySelectorAll('.mbti-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.textContent.includes(mbti));
  });
}

function showCreateModal() {
  document.getElementById('createModal').classList.add('active');
  document.getElementById('newName').value = '';
  selectedMbti = 'INFP';
  initMbtiGrid();
}

function closeCreateModal() {
  document.getElementById('createModal').classList.remove('active');
}

async function createDoll() {
  const name = document.getElementById('newName').value.trim();
  if (!name) {
    showToast('請輸入娃娃名稱', 'error');
    return;
  }

  const rarity = document.getElementById('newRarity').value;
  const doll = await ADV9_DOLL_API.createDoll({
    name,
    mbti: selectedMbti,
    owner: currentUser.id,
    rarity
  });

  closeCreateModal();
  showToast('✨ 新娃娃「' + name + '」創造成功！', 'success');
  await loadDolls();
}

// ─── 商店 ──────────────────────────────────────────────────────────────────────
async function loadShop() {
  const shopDolls = await ADV9_DOLL_API.adminGetShop();
  const section = document.getElementById('shopSection');
  const grid = document.getElementById('shopGrid');

  if (shopDolls.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  grid.innerHTML = shopDolls.map(d => `
    <div class="shop-item" onclick="buyDoll('${d.id}', ${d.price})">
      <div class="s-icon">${d.emoji}</div>
      <div class="s-name">${escHtml(d.name)}</div>
      <div class="s-price">🪙 ${d.price}</div>
      <div style="font-size:10px;color:var(--mut);margin-top:4px;">${d.mbti} · ${d.rarity}</div>
    </div>
  `).join('');
}

async function buyDoll(dollId, price) {
  if (!confirm('確定要購買這個娃娃嗎？需要 ' + price + ' 金幣')) return;

  try {
    const doll = await ADV9_DOLL_API.buyDoll(dollId, currentUser.id, price);
    showToast('🎉 獲得新娃娃「' + doll.name + '」！', 'success');
    await loadDolls();
  } catch(e) {
    showToast('購買失敗：' + e.message, 'error');
  }
}

// ─── 工具函數 ──────────────────────────────────────────────────────────────────
function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast' + (type ? ' ' + type : '');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── 啟動 ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
