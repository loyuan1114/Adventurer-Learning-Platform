<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1526;--panel:#141e34;--panel2:#121c31;--line:#2c3d63;--gold:#f2c14e;--gold2:#ffd97a;--goldD:#7a5f27;
--txt:#e9eef8;--mut:#8fa0bd;--red:#ef5350;--green:#7ed957;--teal:#38d9c0;--purple:#a855f7;
--serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif}
body{font-family:var(--sans);color:var(--txt);min-height:100vh;background:radial-gradient(900px 600px at 85% -10%,rgba(56,217,192,.10),transparent 60%),radial-gradient(800px 520px at -10% 110%,rgba(242,148,60,.11),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg) 40%,var(--panel));background-attachment:fixed}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
a{color:var(--gold);text-decoration:none}
button{font-family:var(--sans);cursor:pointer;border:none;outline:none}
.hud{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(10,14,26,.85);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.hudL{display:flex;align-items:center;gap:10px}
.hlogo{font-size:28px}
.hlv{font-size:18px;font-weight:900;color:var(--gold2);font-family:var(--serif)}
.hsubtitle{font-size:12px;color:var(--mut)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.panel2{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
.vt{font-size:20px;font-weight:900;color:var(--gold2);font-family:var(--serif);margin-bottom:4px}
.vsub{font-size:12.5px;color:var(--mut);font-weight:400}
.tabRow{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;transition:all .15s}
.btn.primary{background:linear-gradient(180deg,var(--gold),#c8862a);color:#1a0a00}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line)}
.btn.teal{background:linear-gradient(180deg,#38d9c0,#1fa89e);color:#0a1a18}
.btn.danger{background:linear-gradient(180deg,#ef5350,#c62828);color:#fff}
.btn.mini{padding:4px 10px;font-size:11.5px;border-radius:6px}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.semT{font-size:12.5px;color:var(--mut);margin:10px 0 6px;font-weight:700}
.empty{color:var(--mut);font-size:13px;padding:12px;text-align:center}
input,select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--txt);font-size:14px;font-family:var(--sans);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.mlabe{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mlabe input[type=number]{width:100px;text-align:center;padding:5px 8px;font-size:14px}
.mlabe input[type=checkbox]{width:auto}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item-card{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.item-card .icon{font-size:28px;min-width:40px;text-align:center}
.item-card .info{flex:1;min-width:0}
.item-card .name{font-weight:700;font-size:14px;color:var(--txt)}
.item-card .rarity{font-size:11px;font-weight:700;margin-top:2px}
.r-N{color:#90caf9}.r-R{color:#ce93d8}.r-SR{color:#ffd54f}.r-SSR{color:#ff8a65}.r-UR{color:#ef5350}
.item-card .actions{display:flex;gap:4px;flex-shrink:0}
.toast-box{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;animation:toastIn .3s ease-out;pointer-events:auto;max-width:90vw;white-space:nowrap}
.toast.ok{background:rgba(126,217,87,.9);color:#0a1a00}
.toast.bad{background:rgba(239,83,80,.9);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
.modal h3{color:var(--gold2);font-family:var(--serif);margin-bottom:14px}
.modal .msub{font-size:12px;color:var(--mut);margin-bottom:14px}
.modal .field{margin-bottom:10px}
.modal .field label{font-size:12px}
.modal .field input,.modal .field select{margin-top:4px}
.modal .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.act-btn{padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700}
.act-edit{background:rgba(56,217,192,.2);color:var(--teal)}
.act-del{background:rgba(239,83,80,.2);color:var(--red)}
.event-toggle{display:flex;align-items:center;gap:12px;padding:14px;border-radius:10px;margin-bottom:10px}
.event-toggle.active{background:rgba(126,217,87,.15);border:1px solid rgba(126,217,87,.4)}
.event-toggle.inactive{background:rgba(255,255,255,.03);border:1px solid var(--line)}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#374151;border-radius:24px;transition:.3s}
.switch .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.event-info{flex:1}
.event-info .ename{font-weight:700;font-size:15px}
.event-info .edesc{font-size:12px;color:var(--mut)}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat-chip{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--mut)}
.stat-chip b{color:var(--txt)}

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function toast(m, t) {
  const box = $('#toasts');
  const d = document.createElement('div');
  d.className = 'toast ' + (t || '');
  d.textContent = m;
  box.appendChild(d);
  setTimeout(() => d.classList.add('out'), 2600);
  setTimeout(() => d.remove(), 3100);
}

function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(CUR));
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s) CUR = { ...CUR, ...s };
  } catch (e) {}
}

  { id: 'events', label: '⚡ 限時活動', desc: '經驗x2 / 掉落x2 開關' },
];

function renderTabs() {
  $('#mainTabs').innerHTML = TABS.map(t =>
    `<button class="btn ${CUR.tab === t.id ? 'primary' : 'ghost'} mini" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchTab(tab) {
  CUR.tab = tab;
  saveState();
  renderTabs();
  if (tab === 'collection') vCollection();
  else if (tab === 'shop') vShop();
  else if (tab === 'events') vEvents();
}

function saveCollection(data) {

  try {
    return JSON.parse(localStorage.getItem('ADV9_EVENTS') || 'null');
  } catch (e) { return null; }
}
function saveEvents(data) {
  localStorage.setItem('ADV9_EVENTS', JSON.stringify(data));
}

// ═══════════════════════════════════════════════════════════════
//  同步到 parent（若有）
// ═══════════════════════════════════════════════════════════════
function syncToParent(key, data) {
  try {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'DOLL_ADMIN_SYNC', key: key, data: data }, '*');
    }
  } catch (e) {}
}

// ═══════════════════════════════════════════════════════════════
//  收藏管理
// ═══════════════════════════════════════════════════════════════
function vCollection() {
  const stored = loadCollection();
  const items = stored || {};
  const cats = ['character', 'pet', 'teammate', 'anime'];

  $('#view').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <span class="vt">🎴 收藏管理</span>
        <span class="vsub">管理 4 大類別的夥伴、寵物、隊友、動漫角色</span>
      </div>
      <button class="btn teal mini" onclick="syncAllToGame()">🔄 同步到遊戲</button>
    </div>
    <div class="stats-row" id="collStats"></div>
    <div class="tabRow" id="catTabs"></div>
    <div id="collContent"></div>
  `;

  // 統計
  let total = 0;
  cats.forEach(c => { total += (items[c] || []).length; });
  $('#collStats').innerHTML = cats.map(c => {
    const count = (items[c] || []).length;
    total += 0;
    return `<div class="stat-chip">${CATEGORIES[c].icon} ${CATEGORIES[c].name}：<b>${count}</b></div>`;
  }).join('') + `<div class="stat-chip">📦 總計：<b>${total}</b></div>`;

  // 分類 tab
  const activeCat = CUR.collCat || 'character';
  $('#catTabs').innerHTML = cats.map(c =>
    `<button class="btn ${activeCat === c ? 'primary' : 'ghost'} mini" onclick="switchCat('${c}')">${CATEGORIES[c].icon} ${CATEGORIES[c].name}</button>`
  ).join('');

  renderCatItems(activeCat, items);
}

function switchCat(cat) {
  CUR.collCat = cat;
  saveState();
  const stored = loadCollection();
  const items = stored || {};
  renderCatItems(cat, items);
}

function renderCatItems(cat, items) {
  const catItems = items[cat] || [];
  const defaultPool = DEFAULT_ITEMS[cat] || {};

  // 合併：後台自訂 + 預設（標記為可編輯/新增）
  const existingNames = new Set(catItems.map(i => i.name));
  const allItems = [...catItems];

  // 顯示所有預設項目（已加入的標記為已收藏）
  Object.entries(defaultPool).forEach(([name, def]) => {
    if (!existingNames.has(name)) {
      allItems.push({ ...def, name: name, added: false });
    }
  });

  $('#collContent').innerHTML = `
    <div class="panel2" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="color:var(--gold2)">${CATEGORIES[cat].icon} ${CATEGORIES[cat].name} – 可新增項目</b>
        <input id="newItemName" placeholder="輸入名稱..." style="width:180px">
        <select id="newItemRarity" style="width:100px">
          <option value="N">N</option><option value="R">R</option>
          <option value="SR">SR</option><option value="SSR">SSR</option><option value="UR">UR</option>
        </select>
        <input id="newItemIcon" placeholder="圖示 emoji" style="width:80px">
        <button class="btn primary mini" onclick="addItem('${cat}')">➕ 新增</button>
      </div>
    </div>
    <div class="card-grid" id="itemGrid">
      ${allItems.length ? allItems.map(item => renderCard(cat, item)).join('') : '<p class="empty">此分類暫無項目</p>'}
    </div>
  `;
}

function renderCard(cat, item) {
  const isAdded = item.added || false;
  const rarityClass = 'r-' + (item.r || 'N');
  const defaultPool = DEFAULT_ITEMS[cat] || {};
  const isDefault = !!(defaultPool[item.name] && !item.custom);

  return `
    <div class="item-card" style="${isAdded ? 'border-color:var(--green)' : ''}">
      <div class="icon">${item.icon || '❓'}</div>
      <div class="info">
        <div class="name">${esc(item.name)}${isAdded ? ' ✅' : ''}</div>
        <div class="rarity ${rarityClass}">${item.r || 'N'}${item.o ? ' | ' + esc(item.o) : ''}</div>
        <div style="font-size:11px;color:var(--mut)">${isDefault ? '預設' : '自訂'}</div>
      </div>
      <div class="actions">
        ${!isAdded ? `<button class="act-btn act-edit" onclick="addToCollection('${cat}','${esc(item.name)}')">收藏</button>`
          : `<button class="act-btn act-del" onclick="removeFromCollection('${cat}','${esc(item.name)}')">移除</button>`}
        <button class="act-btn act-edit" onclick="editItem('${cat}','${esc(item.name)}')">編輯</button>
        ${isDefault ? '' : `<button class="act-btn act-del" onclick="deleteItem('${cat}','${esc(item.name)}')">刪除</button>`}
      </div>
    </div>
  `;
}

function addItem(cat) {
  const name = $('#newItemName').value.trim();
  const r = $('#newItemRarity').value;
  const icon = $('#newItemIcon').value.trim() || '❓';
  if (!name) { toast('請輸入名稱', 'bad'); return; }

  const stored = loadCollection() || {};
  if (!stored[cat]) stored[cat] = [];
  if (stored[cat].some(i => i.name === name)) { toast('此名稱已存在', 'bad'); return; }

  stored[cat].push({ name, r, icon, custom: true, sk: [], o: '', q: '' });
  saveCollection(stored);
  toast(`已新增 ${icon} ${name}`, 'ok');
  renderCatItems(cat, stored);
}

function addToCollection(cat, name) {
  const stored = loadCollection() || {};
  if (!stored[cat]) stored[cat] = [];
  if (stored[cat].some(i => i.name === name)) { toast('已收藏此項目', 'bad'); return; }

  const defaultPool = DEFAULT_ITEMS[cat] || {};
  const def = defaultPool[name];
  if (def) {
    stored[cat].push({ ...def, name, added: true });
  } else {
    stored[cat].push({ name, r: 'N', icon: '❓', custom: true, added: true });
  }
  saveCollection(stored);
  toast(`已收藏 ${name}`, 'ok');
  renderCatItems(cat, stored);
}

function removeFromCollection(cat, name) {
  const stored = loadCollection();
  if (!stored || !stored[cat]) return;
  stored[cat] = stored[cat].filter(i => i.name !== name);
  saveCollection(stored);
  toast(`已移除 ${name}`, 'ok');
  renderCatItems(cat, stored);
}

function deleteItem(cat, name) {
  if (!confirm(`確定刪除「${name}」？`)) return;
  const stored = loadCollection() || {};
  if (!stored[cat]) return;
  stored[cat] = stored[cat].filter(i => i.name !== name);
  saveCollection(stored);
  toast(`已刪除 ${name}`, 'ok');
  renderCatItems(cat, stored);
}

function editItem(cat, name) {
  const stored = loadCollection() || {};
  const item = (stored[cat] || []).find(i => i.name === name);
  if (!item) return;

  openModal(`
    <h3 class="mt">✏️ 編輯 ${item.icon || ''} ${esc(name)}</h3>
    <p class="msub">${CATEGORIES[cat].name}分類</p>
    <div class="field"><label>名稱</label><input id="edName" value="${esc(item.name)}"></div>
    <div style="display:flex;gap:8px">
      <div class="field" style="flex:1"><label>稀有度</label>
        <select id="edRarity">
          <option value="N" ${item.r==='N'?'selected':''}>N</option>
          <option value="R" ${item.r==='R'?'selected':''}>R</option>
          <option value="SR" ${item.r==='SR'?'selected':''}>SR</option>
          <option value="SSR" ${item.r==='SSR'?'selected':''}>SSR</option>
          <option value="UR" ${item.r==='UR'?'selected':''}>UR</option>
        </select>
      </div>
      <div class="field" style="flex:1"><label>圖示 Emoji</label><input id="edIcon" value="${esc(item.icon||'')}"></div>
    </div>
    ${cat === 'teammate' || cat === 'anime' ? `
    <div class="field"><label>故事來源</label><input id="edStory" value="${esc(item.o||'')}"></div>
    <div class="field"><label>台詞</label><input id="edQuote" value="${esc(item.q||'')}"></div>
    ` : ''}
    <div class="btn-row">
      <button class="btn ghost mini" onclick="closeModal()">取消</button>
      <button class="btn primary mini" onclick="saveEdit('${cat}','${esc(name)}')">💾 儲存</button>
    </div>
  `);
}

function saveEdit(cat, oldName) {
  const stored = loadCollection() || {};
  const idx = (stored[cat] || []).findIndex(i => i.name === oldName);
  if (idx < 0) return;

  const newName = $('#edName').value.trim();
  if (!newName) { toast('名稱不能為空', 'bad'); return; }

  stored[cat][idx] = {
    ...stored[cat][idx],
    name: newName,
    r: $('#edRarity').value,
    icon: $('#edIcon').value.trim() || '❓',
    o: $('#edStory') ? $('#edStory').value.trim() : '',
    q: $('#edQuote') ? $('#edQuote').value.trim() : '',
  };
  saveCollection(stored);
  closeModal();
  toast('已儲存', 'ok');
  renderCatItems(cat, stored);
}

function syncAllToGame() {
  const stored = loadCollection();
  if (!stored) { toast('暂无資料', 'bad'); return; }
  syncToParent('ADV9_COLL_ITEMS', stored);
  // 同時通知 index.html
  try {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'DOLL_ADMIN_SYNC', key: 'ADV9_COLL_ITEMS', data: stored }, '*');
    }
  } catch (e) {}
  toast('已同步到遊戲！', 'ok');
}

// ═══════════════════════════════════════════════════════════════
//  商店管理
// ═══════════════════════════════════════════════════════════════
function vShop() {
  const stored = loadShopItems();
  const items = stored || DEFAULT_GSHOP.map(i => ({ ...i }));
  const cats = ['全部', '角色', '寵物', '隊友', '道具'];
  const active = CUR.shopCat || '全部';

  $('#view').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <span class="vt">🏪 商店管理</span>
        <span class="vsub">新增/編輯商店販售的角色、寵物、道具</span>
      </div>
      <button class="btn teal mini" onclick="syncShopToGame()">🔄 同步到遊戲</button>
    </div>
    <div class="tabRow" id="shopCats">${cats.map(c =>
      `<button class="btn ${active===c?'primary':'ghost'} mini" onclick="shopFilter('${c}')">${c}</button>`
    ).join('')}</div>
    <div class="card-grid" id="shopGrid">
      ${items.length ? items.map(item => renderShopCard(item)).join('') : '<p class="empty">暫無商店項目</p>'}
    </div>
    <div class="panel2" style="margin-top:16px">
      <b style="color:var(--gold2)">➕ 新增商店項目</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:end">
        <div class="field" style="flex:2;min-width:160px"><label>顯示名稱</label><input id="shName" placeholder="如：🧩 UR角色「創世之神」"></div>
        <div class="field" style="flex:1;min-width:100px"><label>類型</label>
          <select id="shType">
            <option value="char">角色/寵物/隊友</option>
            <option value="mat">道具材料</option>
            <option value="cur">貨幣</option>
            <option value="exp">經驗道具</option>
          </select>
        </div>
        <div class="field" style="flex:1;min-width:100px"><label>分類</label>
          <select id="shCat">
            <option value="character">角色</option>
            <option value="pet">寵物</option>
            <option value="teammate">隊友</option>
            <option value="anime">動漫</option>
          </select>
        </div>
        <div class="field" style="flex:1;min-width:80px"><label>價格</label><input id="shPrice" type="number" min="1" value="100"></div>
        <div class="field" style="flex:1;min-width:80px"><label>貨幣</label>
          <select id="shCur"><option value="gold">🪙金幣</option><option value="diamond">💎鑽石</option></select>
        </div>
        <div class="field" style="flex:1;min-width:60px"><label>庫存</label><input id="shStock" type="number" min="0" value="3"></div>
        <button class="btn primary mini" onclick="addShopItem()" style="align-self:flex-end">新增</button>
      </div>
    </div>
  `;

  // 預設第一項為角色
  if (items.length > 0 && items[0].cat) {
    const catMap = { character: '角色', pet: '寵物', teammate: '隊友', anime: '動漫' };
    const cat = catMap[items[0].cat] || '全部';
    shopFilter(cat);
  }
}

function shopFilter(cat) {
  CUR.shopCat = cat;
  saveState();
  $$('#shopCats .btn').forEach(b => {
    b.className = 'btn ' + (b.textContent.trim() === cat ? 'primary mini' : 'ghost mini');
  });
  const stored = loadShopItems();
  const items = stored || DEFAULT_GSHOP.map(i => ({ ...i }));
  const filtered = cat === '全部' ? items : items.filter(i => {
    if (cat === '角色') return i.cat === 'character';
    if (cat === '寵物') return i.cat === 'pet';
    if (cat === '隊友') return i.cat === 'teammate' || i.cat === 'anime';
    return i.ty === 'mat' || i.ty === 'cur' || i.ty === 'exp';
  });
  $('#shopGrid').innerHTML = filtered.length ? filtered.map(item => renderShopCard(item)).join('') : '<p class="empty">此分類暫無項目</p>';
}

function renderShopCard(item) {
  const curSym = CUR_SYMBOLS[item.cur] || '🪙';
  return `
    <div class="item-card">
      <div class="icon">${item.icon || '🏷️'}</div>
      <div class="info">
        <div class="name">${esc(item.n || item.name)}</div>
        <div class="rarity r-${item.r || 'R'}">${item.r || 'R'} | 庫存 ${item.stock || '∞'}</div>
        <div style="font-size:11px;color:var(--mut)">${curSym}${item.price}</div>
      </div>
      <div class="actions">
        <button class="act-btn act-edit" onclick="editShopItem('${esc(item.id || item.name)}')">編輯</button>
        <button class="act-btn act-del" onclick="deleteShopItem('${esc(item.id || item.name)}')">刪除</button>
      </div>
    </div>
  `;
}

function addShopItem() {
  const name = $('#shName').value.trim();
  const type = $('#shType').value;
  const cat = $('#shCat').value;
  const price = parseInt($('#shPrice').value) || 100;
  const cur = $('#shCur').value;
  const stock = parseInt($('#shStock').value) || 3;

  if (!name) { toast('請輸入名稱', 'bad'); return; }

  const stored = loadShopItems() || DEFAULT_GSHOP.map(i => ({ ...i }));
  stored.push({
    id: 's' + Date.now(),
    n: name, ty: type, cat: cat,
    name: name, price: price, cur: cur, stock: stock,
    r: 'R', icon: type === 'char' ? '🎁' : '📦',
  });
  saveShopItems(stored);
  toast(`已新增 ${name}`, 'ok');
  vShop();
}

function editShopItem(id) {
  const stored = loadShopItems() || [];
  const item = stored.find(i => (i.id || i.name) === id);
  if (!item) return;

  openModal(`
    <h3 class="mt">✏️ 編輯商店項目</h3>
    <div class="field"><label>顯示名稱</label><input id="edShName" value="${esc(item.n || item.name)}"></div>
    <div style="display:flex;gap:8px">
      <div class="field" style="flex:1"><label>價格</label><input id="edShPrice" type="number" value="${item.price}"></div>
      <div class="field" style="flex:1"><label>庫存</label><input id="edShStock" type="number" value="${item.stock || '∞'}"></div>
      <div class="field" style="flex:1"><label>貨幣</label>
        <select id="edShCur">
          <option value="gold" ${item.cur==='gold'?'selected':''}>🪙金幣</option>
          <option value="diamond" ${item.cur==='diamond'?'selected':''}>💎鑽石</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn ghost mini" onclick="closeModal()">取消</button>
      <button class="btn primary mini" onclick="saveShopEdit('${esc(id)}')">💾 儲存</button>
    </div>
  `);
}

function saveShopEdit(id) {
  const stored = loadShopItems() || [];
  const idx = stored.findIndex(i => (i.id || i.name) === id);
  if (idx < 0) return;
  stored[idx].n = $('#edShName').value.trim();
  stored[idx].price = parseInt($('#edShPrice').value) || 100;
  stored[idx].stock = parseInt($('#edShStock').value) || 999;
  stored[idx].cur = $('#edShCur').value;
  saveShopItems(stored);
  closeModal();
  toast('已儲存', 'ok');
  vShop();
}

function deleteShopItem(id) {
  if (!confirm('確定刪除此商店項目？')) return;
  const stored = loadShopItems() || [];
  const filtered = stored.filter(i => (i.id || i.name) !== id);
  saveShopItems(filtered);
  toast('已刪除', 'ok');
  vShop();
}

function syncShopToGame() {
  const stored = loadShopItems() || [];
  syncToParent('ADV9_SHOP_ITEMS', stored);
  toast('商店資料已同步！', 'ok');
}

// ═══════════════════════════════════════════════════════════════
//  限時活動
// ═══════════════════════════════════════════════════════════════
function vEvents() {
  const stored = loadEvents() || { exp2: false, drop2: false, gold2: false, endTime: null };
  const now = Date.now();
  const endActive = stored.endTime && stored.endTime > now;

  $('#view').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <span class="vt">⚡ 限時活動</span>
        <span class="vsub">開啟全服活動buff，即時對所有玩家生效</span>
      </div>
      <button class="btn teal mini" onclick="syncEventsToGame()">🔄 同步到遊戲</button>
    </div>
    ${endActive ? `<div class="panel2" style="margin-bottom:14px;background:rgba(126,217,87,.1);border-color:rgba(126,217,87,.3)">
      ⏰ 活動結束時間：<b style="color:var(--green)">${new Date(stored.endTime).toLocaleString('zh-TW')}</b>
    </div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
      ${renderEventCard('exp2', '📈 經驗 x2', '所有答題獲得的經驗值翻倍', stored.exp2)}
      ${renderEventCard('drop2', '🍀 掉落 x2', '所有掉落物品數量翻倍', stored.drop2)}
      ${renderEventCard('gold2', '🪙 金幣 x2', '所有金幣獲得翻倍', stored.gold2)}
      ${renderEventCard('crystal2', '💎 水晶 x2', '所有水晶獲得翻倍', stored.crystal2 || false)}
    </div>
    <div class="panel2" style="margin-top:16px">
      <b style="color:var(--gold2)">⏰ 設定活動結束時間</b>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <input type="datetime-local" id="eventEnd" style="width:auto">
        <button class="btn primary mini" onclick="setEventEnd()">設定結束時間</button>
        <button class="btn ghost mini" onclick="clearEventEnd()">清除結束時間</button>
      </div>
    </div>
    <div class="panel2" style="margin-top:12px">
      <b style="color:var(--red)">🚨 立即結束所有活動</b>
      <button class="btn danger mini" style="margin-top:8px" onclick="endAllEvents()">🛑 結束所有活動</button>
    </div>
  `;

  // 預設 datetime-local
  if (stored.endTime) {
    const d = new Date(stored.endTime);
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    $('#eventEnd').value = local;
  }
}

function renderEventCard(key, label, desc, active) {
  return `
    <div class="event-toggle ${active ? 'active' : 'inactive'}" style="border-radius:10px;padding:16px">
      <label class="switch">
        <input type="checkbox" ${active ? 'checked' : ''} onchange="toggleEvent('${key}',this.checked)">
        <span class="slider"></span>
      </label>
      <div class="event-info">
        <div class="ename">${label}</div>
        <div class="edesc">${desc}</div>
      </div>
      <div style="font-size:20px">${active ? '🟢' : '⚪'}</div>
    </div>
  `;
}

function toggleEvent(key, on) {
  const stored = loadEvents() || { exp2: false, drop2: false, gold2: false, crystal2: false, endTime: null };
  stored[key] = on;
  if (on && !stored.endTime) {
    stored.endTime = Date.now() + 24 * 3600000; // 預設24小時
  }
  saveEvents(stored);
  vEvents();
}

function setEventEnd() {
  const val = $('#eventEnd').value;
  if (!val) { toast('請選擇日期時間', 'bad'); return; }
  const stored = loadEvents() || {};
  stored.endTime = new Date(val).getTime();
  saveEvents(stored);
  toast('已設定結束時間', 'ok');
  vEvents();
}

function clearEventEnd() {
  const stored = loadEvents() || {};
  stored.endTime = null;
  saveEvents(stored);
  toast('已清除結束時間', 'ok');
  vEvents();
}

function endAllEvents() {
  if (!confirm('確定結束所有活動？')) return;
  saveEvents({ exp2: false, drop2: false, gold2: false, crystal2: false, endTime: null });
  syncEventsToGame();
  toast('所有活動已結束', 'ok');
  vEvents();
}

function syncEventsToGame() {
  const stored = loadEvents();
  syncToParent('ADV9_EVENTS', stored);
  toast('活動設定已同步！', 'ok');
}

// ═══════════════════════════════════════════════════════════════
//  彈窗
// ═══════════════════════════════════════════════════════════════
function openModal(html) {
  $('#modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() {
