<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

:root{--bg:#0d1526;--panel:#141e34;--panel2:#121c31;--line:#2c3d63;--gold:#f2c14e;--gold2:#ffd97a;--goldD:#7a5f27;

--txt:#e9eef8;--mut:#8fa0bd;--red:#ef5350;--green:#7ed957;--teal:#38d9c0;--serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif}

body{font-family:var(--sans);color:var(--txt);min-height:100vh;overflow-x:hidden;background:

radial-gradient(900px 600px at 85% -10%,rgba(56,217,192,.10),transparent 60%),

radial-gradient(800px 520px at -10% 110%,rgba(242,148,60,.11),transparent 60%),

linear-gradient(180deg,var(--bg),var(--bg) 40%,var(--panel));background-attachment:fixed}

::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite}

.ember{position:absolute;bottom:-12px;width:4px;height:4px;background:#ffb35c;border-radius:50%;filter:blur(1px);animation:rise linear infinite}

@keyframes tw{50%{opacity:.08}}@keyframes rise{to{transform:translateY(-110vh);opacity:0}}

#fxlayer{position:fixed;inset:0;z-index:98;pointer-events:none}

.floater{position:fixed;z-index:99;font-family:var(--serif);font-weight:900;font-size:24px;pointer-events:none;transform:translateX(-50%);animation:fl 1.05s ease-out forwards}

.floater.good{color:#8ee06a;text-shadow:0 0 12px rgba(126,217,87,.7)}.floater.bad{color:#ff7b72}.floater.crit{color:#ffd97a;font-size:32px}

@keyframes fl{to{transform:translateX(-50%) translateY(-72px);opacity:0}}

.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--goldD);border-radius:12px;

box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(242,193,78,.12)}

.panel2{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:15px;transition:.2s}

.btn{font-family:var(--sans);font-weight:700;letter-spacing:.5px;padding:10px 18px;border-radius:5px;border:1px solid #a37c2c;

background:linear-gradient(180deg,#ffd97a,#e0a63a 55%,#c8862a);color:#3a2703;cursor:pointer;box-shadow:0 3px 0 #7a5514;transition:.15s;position:relative;overflow:hidden}

.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #7a5514,0 10px 22px rgba(242,193,78,.28)}
.btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%);opacity:0}
.btn:active::after{width:200px;height:200px;opacity:1;transition:width .3s,height .3s,opacity .3s}

.btn:active{transform:translateY(1px)}

.btn.ghost{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--txt);border-color:var(--line);box-shadow:0 3px 0 rgba(0,0,0,.4)}

.btn.danger{background:linear-gradient(180deg,#ff8a80,#e5484d 55%,#c73a3f);color:#fff;border-color:#8f272b;box-shadow:0 3px 0 #6e1d20}

.btn.teal{background:linear-gradient(180deg,#7ff0dd,#2aa8a0 60%,#1f7d78);color:#03272a;border-color:#1f7d78;box-shadow:0 3px 0 #145550}

.btn.mini{padding:7px 12px;font-size:13px}.btn.big{width:100%;padding:13px;font-size:16px;margin-top:4px}.btn.dis{opacity:.4;pointer-events:none}

input,textarea,select{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:5px;font-family:var(--sans);font-size:14px;outline:none;transition:.2s;width:100%}

input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.15)}

.hud{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,16,30,.96);border-bottom:1px solid var(--goldD)}

.hudL,.hudR{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.hlogo{font-size:24px;filter:drop-shadow(0 0 8px rgba(242,193,78,.6))}

.hlv{font-family:var(--serif);font-weight:900;color:var(--gold2);font-size:17px}

.htitle{font-family:var(--serif);font-weight:700;color:#cfe0ff;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:5px 10px;border-radius:4px;font-weight:700;font-size:12.5px}

.chip b{color:var(--gold2);font-family:var(--serif)}

.chip.cry b{color:#7ff0dd}.chip.coin b{color:#ffd97a}.chip.gem b{color:#d9a7ff}.chip.honor b{color:#ff9d7a}.chip.ap b{color:#c4b5fd}.chip.qp b{color:#9fd8ff}.chip.sl b{color:#c9a6ff}

.chip.imp{color:#ffd97a;border-color:var(--goldD);animation:pulse 1.6s infinite}

@keyframes pulse{50%{box-shadow:0 0 16px rgba(242,193,78,.45)}}

.bar{height:10px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}

.bar i{display:block;height:100%;background:linear-gradient(90deg,#4caf50,#8ee06a);position:relative;transition:width .5s}

.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:shine 2.4s infinite}

@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.xpb{width:110px}.xpwrap{display:flex;align-items:center;gap:6px}.xpwrap b{font-size:11px;color:var(--mut)}

.hpb i{background:linear-gradient(90deg,#c73a3f,#ff7b72)}.enb i{background:linear-gradient(90deg,#2aa8a0,#67d8c8)}.qpb i{background:linear-gradient(90deg,#2aa8a0,#67d8c8)}

.wrap{max-width:1120px;margin:0 auto;padding:16px 18px 60px;position:relative;z-index:1}

.view{padding:20px;min-height:440px;animation:viewIn .35s ease-out}

@keyframes pop{from{transform:scale(.97);opacity:0}}

.vt{font-family:var(--serif);font-weight:900;font-size:21px;color:var(--gold2);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.vsub{font-size:13px;color:var(--mut);font-family:var(--sans);font-weight:500}

.empty{color:var(--mut);text-align:center;padding:28px 0}

.back{margin-bottom:12px}

.featGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.feat{background:linear-gradient(180deg,var(--panel2),#101a2e);border:1px solid var(--line);border-left:4px solid var(--fc,#888);border-radius:11px;padding:14px 13px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}

.feat:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.45);border-color:var(--fc)}

.feat::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:translateX(-100%);transition:.5s}

.feat:hover::after{transform:translateX(100%)}

.fIco{font-size:26px;display:block;margin-bottom:6px}

.feat b{display:block;font-family:var(--serif);font-size:14.5px}

.feat i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px}
.feat{min-height:92px}
.featCat{font-family:var(--serif);font-weight:900;font-size:15.5px;color:var(--gold2);margin:18px 0 8px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.featCat::before,.featCat::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,130,.35),transparent)}

.subjGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

.subjB{border:none;border-radius:8px;padding:16px 10px;cursor:pointer;color:#fff;font-family:var(--serif);font-weight:900;font-size:16px;transition:.18s;box-shadow:0 4px 0 rgba(0,0,0,.35)}

.subjB:hover{transform:translateY(-4px) scale(1.03);filter:brightness(1.15)}

.unitRow{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--txt);padding:8px 12px;font-size:13.5px;cursor:pointer;border-radius:4px;transition:.15s}

.unitRow:hover{background:rgba(242,193,78,.1);transform:translateX(4px)}

.semT{font-family:var(--serif);color:var(--teal);font-weight:900;font-size:14px;margin:10px 4px 4px}

.qStatus{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

.qCard{margin-bottom:10px}

.qTag{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:900}

.qStem{font-size:17px;line-height:1.8;margin:10px 0 14px;white-space:pre-wrap}

.optBtn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:12px 14px;margin-bottom:7px;border-radius:6px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s}

.optBtn:hover{border-color:var(--gold);transform:translateX(6px);background:rgba(242,193,78,.08)}

.optBtn.sel{border-color:var(--teal);background:rgba(56,217,192,.12)}

.optBtn.ok{border-color:#4caf50;background:rgba(76,175,80,.18);color:#a5f0b5}

.optBtn.no{border-color:#e5484d;background:rgba(229,72,77,.15);color:#ffb4ab}

.optBtn.lock{pointer-events:none;opacity:.85}

.calc{font-family:Consolas,monospace;color:#00ff88;background:#050b14!important}

.resBig{font-family:var(--serif);font-weight:900;font-size:26px;text-align:center;margin:8px 0}

.rwRow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}

.rwChip{background:linear-gradient(180deg,rgba(242,193,78,.12),rgba(0,0,0,.35));border:1px solid var(--goldD);color:var(--gold2);padding:6px 13px;border-radius:99px;font-weight:700;font-size:13px;animation:pop .3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.quote{color:#c9a6ff;font-size:12.5px;text-align:center;margin:8px 0}

.expl{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;margin:10px 0}

.tabRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.tabB{padding:9px 16px;border-radius:5px 5px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--panel2);color:var(--mut);font-weight:700;cursor:pointer;font-size:13.5px;transition:.15s}

.tabB:hover{color:var(--gold2)}

.tabB.on{color:var(--gold2);background:#182338;border-top:2px solid var(--gold)}

.rarN{color:#9ca3af}.rarR{color:#22c55e}.rarSR{color:#3b82f6}.rarSSR{color:#a855f7}.rarUR{color:#f59e0b}

.collIt{display:flex;gap:12px;align-items:center;margin-bottom:8px}

.collIt .pBox{width:52px;height:52px;background:rgba(0,0,0,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}

.collInfo{flex:1;min-width:0}

.skTxt{font-size:11px;color:var(--mut);margin-top:2px}

.pkArena{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}

.pkSide{padding:14px;border-radius:8px;border:1px solid var(--line)}

.pkSide.me{border-color:var(--teal);background:rgba(56,217,192,.05)}

.pkSide.foe{border-color:var(--red);background:rgba(239,83,80,.05)}

.pkName{font-family:var(--serif);font-weight:900;font-size:16px;margin-bottom:8px}

.pkIco{font-size:44px;text-align:center;margin:6px 0;transition:.2s}

.pkIco.hit{animation:hitFx .35s}

.pkIco.atk{animation:atkFx .4s}

@keyframes hitFx{25%{transform:translateX(-9px) scale(.94);filter:brightness(1.7) drop-shadow(0 0 14px #ef5350)}75%{transform:translateX(9px)}}

@keyframes atkFx{30%{transform:translateX(14px) scale(1.08)}}

.pkLog{height:150px;overflow-y:auto;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12.5px;line-height:1.9}

.pkLog .crit{color:var(--gold2);font-weight:900}

.pkLog .dmg{color:#ff9d97}.pkLog .heal{color:#8ee06a}

.flashWin{animation:winFl .8s}

@keyframes winFl{0%,100%{box-shadow:none}50%{box-shadow:0 0 40px rgba(242,193,78,.8)}}

.forgeAnvil{font-size:70px;text-align:center;margin:10px 0;transition:.1s}

.forgeAnvil.strike{animation:strike .3s}

@keyframes strike{30%{transform:scale(.9) rotate(-6deg);filter:brightness(1.8) drop-shadow(0 0 20px #ffb35c)}}

.sparkFx{position:absolute;pointer-events:none;font-size:18px;animation:spark .7s ease-out forwards}

@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

.tblWrap{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-size:13.5px}

th{background:rgba(0,0,0,.3);color:var(--gold2);font-family:var(--serif);padding:9px 11px;text-align:left;border-bottom:2px solid var(--goldD);white-space:nowrap}

td{padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}

tbody tr{transition:.15s}tbody tr:hover td{background:rgba(242,193,78,.05)}

code{background:rgba(0,0,0,.3);border:1px solid var(--line);padding:2px 7px;border-radius:4px;color:var(--teal);font-size:12px}

.rankIt{display:flex;align-items:center;gap:12px;margin-bottom:8px}

.rMed{font-size:22px}.rName{flex:1}.rLv{color:#cfe0ff;font-size:12.5px}.rXp{color:var(--mut);font-size:12px}

.rankIt.top0{border-color:var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.14),transparent)}

.chatBox{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:6px}

/* ── LINE／IG／FB 風格對話氣泡（簡訊類）── */
.chatMsg{display:flex;gap:10px;align-items:flex-end;max-width:100%;animation:pop .25s}
.chatMsg.mine{flex-direction:row-reverse}
.cmAv{flex:0 0 auto;display:flex;align-items:flex-end}
.cmAv img{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.cmCol{display:flex;flex-direction:column;max-width:86%;min-width:0}
.chatMsg.mine .cmCol{align-items:flex-end}
.cmName{font-size:12px;color:var(--mut);margin:0 4px 3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cmName b{color:var(--gold2);font-size:13px}
.chatMsg.admin .cmName b{color:var(--gold)}
.chatMsg.teacher .cmName b{color:#7ea6ff}
.chatMsg.mine .cmName{justify-content:flex-end}
.cTime{color:var(--mut);font-size:11px}
.cmBub{background:rgba(255,255,255,.1);border:1px solid var(--line);color:#e8eefb;border-radius:16px 16px 16px 6px;padding:10px 16px;font-size:15px;line-height:1.6;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chatMsg.mine .cmBub{background:linear-gradient(135deg,#00b894,#00a381);border-color:transparent;color:#fff;border-radius:16px 16px 6px 16px}
.cmBub p{margin:0;font-size:15px;word-break:break-word}
.chatMsg.mine .cmBub p{color:#fff}
.cmBub img{max-width:460px;border-radius:12px;display:block;margin:3px 0;border:1px solid var(--line);cursor:zoom-in}
.cmBub video{max-width:480px;border-radius:12px;display:block;margin:3px 0}
.chatMsg .btn{font-size:11.5px;padding:4px 8px}
.chatMsg.system{align-self:center;display:flex;justify-content:center}
.chatMsg.system .cmCol{max-width:100%;align-items:center}
.chatMsg.system .cmBub{background:rgba(255,255,255,.07);color:var(--mut);border-radius:14px;padding:5px 16px;font-size:13px}
.chatMsg.system .cmBub p{font-size:13px;color:var(--mut)}
/* 👁 上線狀態標籤 */
.onlBadge{font-size:11px;margin-left:6px;padding:1px 8px;border-radius:10px;display:inline-block;vertical-align:middle}
.onlBadge.on{color:#4ade80;background:rgba(74,222,128,.14)}
.onlBadge.off{color:var(--mut);background:rgba(255,255,255,.06)}

.annIt{margin-bottom:12px}.annIt b{font-family:var(--serif);font-size:15.5px;color:var(--gold2)}

.annMeta{display:block;color:var(--mut);font-size:12px;margin:4px 0 6px}.annIt p{font-size:13.5px;line-height:1.7}

.statGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}

.statIt{text-align:center}.statIt span{font-size:11.5px;color:var(--mut);display:block}.statIt b{font-family:var(--serif);font-size:24px;color:var(--gold2)}

.cRow{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;margin-bottom:8px}

.cVal{font-size:11.5px;color:var(--mut);text-align:right}

.abRow{display:flex;align-items:center;gap:10px;margin-bottom:7px}

.abRow .bar{flex:1}

.expIt{margin-bottom:10px}.expIt b{font-family:var(--serif);font-size:15px}

.stepLi{font-size:13px;line-height:1.9;padding-left:6px}

.frIt{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}

.onDot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}

.onDot.on{background:#4caf50;box-shadow:0 0 6px #4caf50}.onDot.off{background:#555}

.pdfWrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.pdfWrap iframe{width:100%;height:520px;border:1px solid var(--line);border-radius:6px;background:#fff}

.terrGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;max-height:300px;overflow-y:auto;padding:6px 4px}

.terrChip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 4px;font-weight:700;cursor:pointer;color:#fff;transition:.15s;text-align:center;background:var(--tc,#333c50);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}

.terrChip .tcNum{font-size:11px;line-height:1.1}.terrChip .tcLv{font-size:9.5px;opacity:.85;font-weight:800}

.terrChip:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15);box-shadow:0 6px 14px rgba(0,0,0,.4)}

.terrChip.done{background:linear-gradient(160deg,#2f6b45,#204d33)!important;border-color:#3c8a5a;cursor:default;color:#cdeed6}

.terrChip.lock{background:#1c2740!important;border-color:var(--line);color:#5b6a86;cursor:not-allowed;box-shadow:none}

.terrChip.next{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(242,193,78,.4);animation:pulse 1.6s infinite}

.terrChip.boss{border-color:var(--gold2)}.terrChip.boss .tcNum{color:#fff;text-shadow:0 0 6px rgba(255,217,122,.8)}

.terrInfo{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

.terrInfo span{flex:1;min-width:220px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--mut);line-height:1.6}

.terrInfo b{color:var(--gold2)}

.alogGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-height:62vh;overflow-y:auto;padding:4px 2px}

.alogCard{aspect-ratio:16/9;display:flex;flex-direction:column;background:linear-gradient(155deg,#1a2540,#101a2e);border:1px solid var(--line);border-left:5px solid var(--fc,#888);border-radius:14px;padding:12px 15px;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:.18s;overflow:hidden;position:relative}

.alogCard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.55);border-color:var(--fc)}

.alogCard.ok{--fc:#4caf50}.alogCard.no{--fc:#e5484d}

.alogTop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}

.alogTop .rsBadge{font-family:var(--serif);font-weight:900;font-size:13px;color:var(--fc)}

.alogTag{padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut);font-weight:700}

.alogTime{margin-left:auto;color:var(--mut);font-size:10.5px}

.alogStem{flex:1;margin:9px 0;font-size:14px;line-height:1.55;color:var(--txt);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

.alogBot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;border-top:1px solid var(--line);padding-top:7px}

.alogBot .ansv{flex:1;min-width:0;color:#cfe0ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.alogBot .sec{color:var(--gold2);font-weight:700;font-family:var(--serif)}

.alogBot .calc{background:rgba(56,217,192,.14);border:1px solid var(--teal);color:var(--teal);padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}

.gshopIt{position:relative;border:1px solid var(--goldD);background:linear-gradient(160deg,#1a2540,#121c31)}

.gshopIt .stockTag{position:absolute;top:-8px;right:10px;background:#e5484d;color:#fff;font-size:10px;padding:2px 9px;border-radius:99px;font-weight:900}

.gshopIt.soldout{opacity:.45}

.tradeIt{border:1px solid var(--line);border-left:4px solid var(--teal)}

.tradeIt .valNote{font-size:11px;color:var(--mut)}

.upType{display:inline-block;font-size:10px;font-weight:900;padding:2px 8px;border-radius:99px;margin-left:6px}

.upType.star{background:rgba(201,166,255,.18);color:#c9a6ff;border:1px solid #6a4fa0}

.upType.enh{background:rgba(255,157,122,.15);color:#ff9d7a;border:1px solid #8a4a35}

#login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;max-width:1060px;margin:0 auto;padding:44px 22px;position:relative;z-index:1}

.emb{font-size:84px;width:max-content;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(242,193,78,.45))}

@keyframes bob{50%{transform:translateY(-8px)}}

.logoT{font-family:var(--serif);font-weight:900;font-size:clamp(32px,5vw,50px);line-height:1.15;color:#f6d78a;text-shadow:0 2px 0 #7a5514,0 4px 18px rgba(242,193,78,.35);margin-top:10px}

.verRow{display:flex;gap:8px;margin:14px 0 20px}

.verChip{border:1px solid var(--goldD);color:var(--gold2);padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700}

.verChip.star{background:linear-gradient(90deg,#c8862a,#e8b64c);color:#3a2703;border:none}

.featL{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}

.featL li{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line);padding:9px 13px;border-radius:5px;transition:.2s}

.featL li:hover{transform:translateX(6px);border-color:var(--goldD)}

.featL b{font-size:20px}.featL strong{color:var(--gold2);display:block;font-family:var(--serif)}

.featL span{font-size:12.5px;color:var(--mut);line-height:1.5}

.lgCard{padding:28px 26px}

.cor{position:absolute;width:20px;height:20px;border-color:var(--gold);border-style:solid;border-width:0;z-index:2}

.tl{top:-2px;left:-2px;border-top-width:3px;border-left-width:3px}.tr{top:-2px;right:-2px;border-top-width:3px;border-right-width:3px}

.bl{bottom:-2px;left:-2px;border-bottom-width:3px;border-left-width:3px}.br{bottom:-2px;right:-2px;border-bottom-width:3px;border-right-width:3px}

.lgT{font-family:var(--serif);font-weight:900;font-size:21px;color:var(--gold2)}

.lgSub{color:var(--mut);margin:6px 0 14px;font-size:13.5px}

.roleTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}

.rtab{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--mut);padding:10px 4px;border-radius:5px;cursor:pointer;font-weight:700;font-size:12.5px;line-height:1.6;transition:.15s;font-family:var(--sans)}

.rtab:hover{color:var(--gold2);transform:translateY(-2px)}

.rtab.on{background:linear-gradient(180deg,#2a3a63,#1c2a4c);border-color:var(--gold);color:var(--gold2);box-shadow:0 0 12px rgba(242,193,78,.2)}

.lgHint{margin-top:12px;font-size:12.5px;color:var(--mut);background:rgba(0,0,0,.25);border:1px solid var(--line);padding:9px 12px;border-radius:5px}

.lgHint b{color:var(--teal)}

.lgNote{margin-top:8px;font-size:12px;color:var(--mut)}

.lgReset{margin-top:12px;font-size:12px}.lgReset a{color:#ff8a80;text-decoration:none}

.shake{animation:shk .4s}

@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.mwrap{position:fixed;inset:0;background:rgba(4,8,16,.78);z-index:110;display:flex;align-items:center;justify-content:center;padding:20px}

.mpanel{width:100%;max-width:480px;padding:22px;animation:pop .25s;max-height:88vh;overflow-y:auto}

.mt{font-family:var(--serif);font-weight:900;color:var(--gold2);font-size:19px;margin-bottom:6px}

.msub{color:var(--mut);font-size:12.5px;margin-bottom:12px}

.mlab{display:block;font-size:12.5px;color:var(--mut);margin-bottom:11px;font-weight:700}

.mlab input,.mlab select{margin-top:5px}

.mBtns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

#toasts{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px}

.toast{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--goldD);border-left:4px solid var(--gold);padding:11px 15px;border-radius:5px;font-weight:700;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .25s;max-width:330px}

.toast.bad{border-left-color:var(--red)}

.toast.out{opacity:0;transform:translateX(30px);transition:.4s}

@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes slideInL{from{transform:translateX(-120px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInR{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes critShake{0%,100%{transform:translate(0)}10%{transform:translate(-6px,4px)}20%{transform:translate(6px,-4px)}30%{transform:translate(-4px,6px)}40%{transform:translate(4px,-6px)}50%{transform:translate(-2px,2px)}}
@keyframes victoryPop{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes urGlow{0%,100%{box-shadow:0 0 15px rgba(245,158,11,.4),0 0 30px rgba(245,158,11,.2)}50%{box-shadow:0 0 30px rgba(245,158,11,.8),0 0 60px rgba(245,158,11,.4)}}
@keyframes urReveal{0%{transform:scale(0) rotate(-180deg);opacity:0;filter:brightness(3)}60%{transform:scale(1.2) rotate(10deg);opacity:1;filter:brightness(2)}100%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1)}}
@keyframes goldRain{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes modalIn{from{transform:translateY(40px) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes levelUp{0%{transform:scale(0);opacity:0}40%{transform:scale(1.3);opacity:1}70%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes rewardDrop{0%{transform:translateY(-60px) scale(1.5);opacity:0}60%{transform:translateY(10px) scale(1);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes enhSuccess{0%{transform:scale(1);box-shadow:none}50%{transform:scale(1.08);box-shadow:0 0 20px rgba(242,193,78,.6)}100%{transform:scale(1);box-shadow:none}}
@keyframes enhFail{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.pkSlideL{animation:slideInL .5s ease-out}
.pkSlideR{animation:slideInR .5s ease-out}
.critShake{animation:critShake .5s}
.victoryPop{animation:victoryPop .6s ease-out}
.urCard{animation:urReveal .8s ease-out,urGlow 2s infinite 0.8s}
.modalAnim .mpanel{animation:modalIn .3s ease-out}
.fadeIn{animation:fadeIn .3s}
.enhOk{animation:enhSuccess .6s}
.enhNo{animation:enhFail .5s}
.pkSkillFx{position:absolute;font-size:28px;pointer-events:none;animation:victoryPop .5s ease-out forwards;z-index:5}
@keyframes goldFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.gachaFlash{position:fixed;inset:0;z-index:150;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,217,122,.9),rgba(242,193,78,.4) 42%,transparent 75%);animation:goldFlash .95s ease-out forwards}
@keyframes ssrReveal{0%{transform:scale(0) rotate(120deg);opacity:0;filter:brightness(2.6)}60%{transform:scale(1.14) rotate(-6deg);opacity:1;filter:brightness(1.8)}100%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1)}}
@keyframes ssrGlow{0%,100%{box-shadow:0 0 12px rgba(168,85,247,.4)}50%{box-shadow:0 0 26px rgba(168,85,247,.85),0 0 48px rgba(168,85,247,.35)}}
.ssrCard{animation:ssrReveal .7s ease-out,ssrGlow 2.2s infinite .7s}
@keyframes hiBanner{0%{transform:translateX(-50%) scale(0);opacity:0}45%{transform:translateX(-50%) scale(1.25);opacity:1}70%{transform:translateX(-50%) scale(.96)}100%{transform:translateX(-50%) scale(1);opacity:1}}
/* ── 稀有度顏色 ── */
.equipR{color:#22c55e}.equipE{color:#4fc3f7}.equipA{color:#fff176}.equipS{color:#64b5f6}
.equipSS{color:#9575cd}.equipSSS{color:#e040fb}.equipZ{color:#ff5252}.equipZZ{color:#ff9800}
.equipZZZ{color:#f50057}
@keyframes rainbowFlow{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.equipINF{background:linear-gradient(90deg,#ff0000,#ff8800,#ffff00,#00ff00,#0088ff,#8800ff,#ff0000);background-size:400% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowFlow 2s linear infinite}
/* ── 裝備紙娃娃 ── */
.dollView{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
.dollAvatar{text-align:center}
.dollAvatar .dollIcon{font-size:80px;display:block;margin:0 auto 8px;animation:bob 3s infinite;filter:drop-shadow(0 0 12px rgba(242,193,78,.4))}
.dollSlots{display:flex;flex-direction:column;gap:8px}
.slotRow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;transition:.15s}
.slotRow:hover{border-color:var(--goldD)}
.slotIcon{font-size:22px;width:32px;text-align:center;flex:none}
.slotLabel{font-size:11px;color:var(--mut);font-weight:700;min-width:36px}
.slotItem{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotEmpty{color:var(--mut);font-size:12px;font-style:italic}
.slotBtns{display:flex;gap:4px;flex:none}
/* ── 副本戰鬥 ── */
.dungeonCanvasWrap{position:relative;width:100%;max-width:640px;margin:0 auto}
#dungeonCanvas{width:100%;height:400px;background:#0a0e1a;border:1px solid var(--line);border-radius:8px;display:block}
.dungeonHUD{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.dungeonWave{font-family:var(--serif);font-weight:900;color:var(--gold2);font-size:15px}
.dungeonHPBar{flex:1;min-width:120px}
.dungeonHPBar .bar{height:14px}
.dungeonHPBar .bar i{background:linear-gradient(90deg,#c73a3f,#ff7b72)}
.dungeonEnemyHP .bar i{background:linear-gradient(90deg,#e5484d,#ff8a80)}
.dungeonMobList{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;font-size:12px}
.dungeonMob{padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.dungeonMob.alive{border-color:#4caf50;color:#8ee06a}
.dungeonMob.dead{opacity:.4;text-decoration:line-through}
.dungeonBoss{border-color:var(--gold)!important;color:var(--gold2)!important;font-weight:900}
.dungeonLog{height:100px;overflow-y:auto;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11.5px;line-height:1.7}
.dungeonLog .crit{color:var(--gold2);font-weight:900}
.dungeonLog .dmg{color:#ff9d97}
.dungeonLog .heal{color:#8ee06a}
.dungeonLog .info{color:var(--teal)}
.touchControls{display:none;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.touchCtrl{width:56px;height:56px;border-radius:50%;background:rgba(242,193,78,.15);border:2px solid var(--goldD);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.touchCtrl:active{background:rgba(242,193,78,.35)}
.touchDpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.touchDpad .touchCtrl{font-size:18px}
.touchDpad .empty{visibility:hidden}
@media(hover:none)and(pointer:coarse){.touchControls{display:flex!important}}
/* ── 重新滾動統計值 ── */
.rerollPanel{display:grid;grid-template-columns:1fr 280px;gap:14px}
@media(max-width:860px){.rerollPanel{grid-template-columns:1fr}}
.rerollAttrRow{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;transition:.15s}
.rerollAttrRow:hover{border-color:var(--goldD)}
.rerollAttrIcon{font-size:22px;width:30px;text-align:center;flex:none}
.rerollAttrName{flex:1;min-width:0;font-size:13px;font-weight:700}
.rerollBadge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:900;font-family:var(--serif);flex:none}
.rerollBadge.R{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.rerollBadge.E{background:rgba(79,195,247,.15);color:#4fc3f7;border:1px solid rgba(79,195,247,.3)}
.rerollBadge.A{background:rgba(255,241,118,.15);color:#fff176;border:1px solid rgba(255,241,118,.3)}
.rerollBadge.S{background:rgba(100,181,246,.15);color:#64b5f6;border:1px solid rgba(100,181,246,.3)}
.rerollBadge.SS{background:rgba(149,117,205,.15);color:#9575cd;border:1px solid rgba(149,117,205,.3)}
.rerollBadge.SSS{background:rgba(224,64,251,.15);color:#e040fb;border:1px solid rgba(224,64,251,.3)}
.rerollBadge.Z{background:rgba(239,83,80,.15);color:#ff5252;border:1px solid rgba(239,83,80,.3)}
.rerollBadge.ZZ{background:rgba(255,152,0,.15);color:#ff9800;border:1px solid rgba(255,152,0,.3)}
.rerollBadge.ZZZ{background:rgba(245,0,87,.15);color:#f50057;border:1px solid rgba(245,0,87,.3)}
.rerollBadge.INF{animation:rainbowFlow 2s linear infinite;background:linear-gradient(90deg,#ff0000,#ff8800,#ffff00,#00ff00,#0088ff,#8800ff,#ff0000);background-size:400% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;border:1px solid rgba(255,255,255,.3)}
.rerollBonus{font-size:12px;color:var(--mut);flex:none;width:50px;text-align:right}
.rerollBtns{display:flex;gap:4px;flex:none;flex-wrap:wrap}
.rerollSide{display:flex;flex-direction:column;gap:10px}
.rerollAutoDel{margin-top:8px}
.rerollAutoDel select{width:100%;margin-top:4px}
/* ── 裝備卡片 ── */
.equipCard{border:1px solid var(--line);border-radius:10px;padding:12px;background:linear-gradient(160deg,rgba(20,30,52,.9),rgba(10,16,30,.95));transition:.18s}
.equipCard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.equipCardR{border-color:rgba(34,197,94,.3)}.equipCardE{border-color:rgba(79,195,247,.3)}.equipCardA{border-color:rgba(255,241,118,.3)}.equipCardS{border-color:rgba(100,181,246,.3)}
.equipCardSS{border-color:rgba(149,117,205,.3)}.equipCardSSS{border-color:rgba(224,64,251,.3)}.equipCardZ{border-color:rgba(239,83,80,.3)}.equipCardZZ{border-color:rgba(255,152,0,.3)}
.equipCardZZZ{border-color:rgba(245,0,87,.3)}.equipCardINF{border-color:rgba(255,255,255,.5);animation:ssrGlow 2.2s infinite,rainbowFlow 3s linear infinite}
.equipName{font-family:var(--serif);font-weight:900;font-size:14px;margin-bottom:4px}
.equipSub{font-size:11px;color:var(--mut);margin-bottom:6px}
.equipSubs{font-size:11.5px;line-height:1.6}
.equipSubs div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.equipSubs .sv{color:var(--gold2);font-weight:700}
.equipLv{font-size:11px;color:var(--teal);margin-top:4px}
.equipMain{font-size:12px;color:var(--txt);margin-top:3px}
/* ── 副本地圖 ── */
.dunMapGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:5px;max-height:280px;overflow-y:auto;padding:6px 4px}
.dunTile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 4px;font-weight:700;cursor:pointer;color:#fff;transition:.15s;text-align:center;font-size:11px;background:var(--tc,#2a3050)}
.dunTile:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15)}
.dunTile.done{background:linear-gradient(160deg,#2f6b45,#204d33)!important;border-color:#3c8a5a;cursor:default;color:#cdeed6}
.dunTile.lock{background:#1c2740!important;border-color:var(--line);color:#5b6a86;cursor:not-allowed}
.dunTile.next{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(242,193,78,.4);animation:pulse 1.6s infinite}
.dunTile.boss{border-color:var(--gold2)}.dunTile.boss .tcNum{color:#fff;text-shadow:0 0 6px rgba(255,217,122,.8)}
.dunTile.waveInfo{font-size:10px;opacity:.7}
.lootFloat{position:fixed;font-size:18px;font-family:var(--serif);font-weight:900;pointer-events:none;z-index:200;animation:rewardDrop .9s ease-out forwards}

.spIn h2{font-family:var(--serif);font-weight:900;color:var(--gold2);margin:10px 0 6px;font-size:23px}

.spIn p{color:var(--mut);font-size:13.5px}

.spBar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd97a);width:0;animation:load 1s forwards}

@media(max-width:900px){#login{grid-template-columns:1fr;max-width:520px;gap:26px}.pdfWrap,.pkArena{grid-template-columns:1fr}.cRow{grid-template-columns:86px 1fr 86px}}

@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.lgLeft{animation:lgInL .7s cubic-bezier(.2,.9,.3,1) both}

@keyframes lgInL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:translateX(0)}}

@keyframes fadeOutFx{to{opacity:0}}

#app.appIn{animation:viewIn .55s ease both}

@keyframes splashFadeOut {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; display: none; }
}
#splash { animation: splashFadeOut 2.5s forwards; }

.ldLogo{font-size:64px;animation:swordIn .7s cubic-bezier(.2,1.4,.4,1) both,ldGlow 1.6s ease-in-out .7s infinite;filter:drop-shadow(0 0 18px rgba(242,193,78,.85))}
@keyframes ldGlow{50%{transform:scale(1.12);filter:drop-shadow(0 0 34px rgba(255,217,122,1))}}
.ldTitle{font-family:var(--serif);font-weight:900;margin:12px 0 4px;font-size:26px;background:linear-gradient(90deg,#f2c14e 20%,#fff7d6 40%,#f2c14e 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ldSheen 1.8s linear infinite,riseIn .6s ease .2s both}

if(b[y*15+x]!==p)continue;
for(const d of [[1,0],[0,1],[1,1],[1,-1]]){
let k=1;while(k<5){const nx=x+d[0]*k,ny=y+d[1]*k;if(nx<0||nx>=15||ny<0||ny>=15||b[ny*15+nx]!==p)break;k++}
if(k>=5)return true}}
return false}

function gmkAI(){
const s=CUR.gmk;if(!s||!s.b)return -1;const b=s.b;let best=-1,bs=-1;
for(let i=0;i<225;i++){
if(b[i])continue;
const x=i%15,y=(i/15)|0;
let sc=0;
for(const d of [[1,0],[0,1],[1,1],[1,-1]]){
for(const p of [2,1]){
let cnt=0;
for(let k=1;k<5;k++){const nx=x+d[0]*k,ny=y+d[1]*k;if(nx<0||nx>=15||ny<0||ny>=15||b[ny*15+nx]!==p)break;cnt++}
for(let k=1;k<5;k++){const nx=x-d[0]*k,ny=y-d[1]*k;if(nx<0||nx>=15||ny<0||ny>=15||b[ny*15+nx]!==p)break;cnt++}
sc+=(p===2?1.1:1)*Math.pow(10,cnt);
}}
sc+=Math.random();
if(sc>bs){bs=sc;best=i}}
return best}

function tetHit(m,px,py){const s=CUR.tet;if(!s||!s.b)return true;
for(let y=0;y<m.length;y++)for(let x=0;x<m[0].length;x++){
if(!m[y][x])continue;const nx=px+x,ny=py+y;
if(nx<0||nx>=10||ny>=20)return true;
if(ny>=0&&s.b[ny][nx])return true}
return false}

function tetRot(){const s=CUR.tet;if(!s||!s.cur)return;const m=s.cur[0].map((_,i)=>s.cur.map(r=>r[i]).reverse());if(!tetHit(m,s.x,s.y))s.cur=m}

function genEquipment(slot,dungeonTier){
  const rarity=rollEqRarity(dungeonTier);
  const name=rarity==='∞'?'∞神器·':'';
  let itemName=name;
  if(slot==='武器'){const w=pick(EQ_WEAPONS);itemName+=w.icon+' '+w.name}else{
    const prefixes={'頭':['鐵','鋼','精金','魔'],'衣服':['布','皮','鎧','板'],'褲子':['腿','膝','護'],'鞋子':['皮','戰','疾'],'戒指':['銀','金','秘'],'項鍊':['骨','玉','水晶']};
    const p=prefixes[slot]?.[Math.floor(Math.random()*4)]||'';itemName+=p+'裝';
  }
  const mainAttr=EQ_MAIN_ATTR[slot];
  const mainVal=Math.round((slot==='武器'?5:slot==='戒指'?3:slot==='項鍊'?2:slot==='鞋子'?1.5:slot==='頭'?2:slot==='衣服'?20:3)*({R:1,E:1.5,A:2,S:2.5,SS:3,SSS:3.5,Z:4,ZZ:5,ZZZ:6,'∞':8}[rarity]||1)*10)/10;
  const subN=eqSubCount(rarity);const subs=[];
  for(let i=0;i<subN;i++){const st=pick(EQ_SUB_STAT_POOL);subs.push({stat:st,value:parseFloat(eqSubValue(rarity,st).toFixed(2))})}
  return{id:'eq'+Date.now()+Math.random().toString(36).slice(2,6),name:itemName,rarity,slot,level:0,maxLevel:rarity==='∞'?150:100,mainAttr,mainValue:mainVal,subStats:subs};
}

const LOCK_ON=true; /* 設 false 可暫時解除保護（自己除錯時用） */
(function(){
  if(!LOCK_ON)return;
  const warn=(m)=>{try{
    let t=document.getElementById('__lockWarn');
    if(!t){t=document.createElement('div');t.id='__lockWarn';
      t.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:2147483647;background:#c73a3f;color:#fff;font:700 14px/1.5 sans-serif;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:.3s';
      (document.body||document.documentElement).appendChild(t);}
    t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);
  }catch(e){}};
  /* 禁用右鍵選單（含「檢視原始碼」「另存」）*/
  addEventListener('contextmenu',e=>{e.preventDefault();warn('🔒 已停用右鍵');},true);
  /* 快捷鍵封鎖：F12／Ctrl+Shift+I,J,C,K／Ctrl+U 檢視原始碼／Ctrl+S 另存 */
  addEventListener('keydown',e=>{
    const k=(e.key||'').toLowerCase();
    const block=e.key==='F12'
      ||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','k'].includes(k))
      ||((e.ctrlKey||e.metaKey)&&['u','s'].includes(k));
    if(block){e.preventDefault();e.stopPropagation();warn('🔒 已停用開發者工具／檢視原始碼');return false;}
    if(e.key==='PrintScreen'||k==='printscreen'){ /* 截圖嚇阻：清空剪貼簿 */
      try{navigator.clipboard&&navigator.clipboard.writeText('🔒 本頁禁止截圖');}catch(_){}
      warn('🔒 已嘗試阻擋截圖');
    }
  },true);
  /* 偵測開發者工具開啟（視窗尺寸差）→ 模糊畫面嚇阻 */
  let devOpen=false;
  setInterval(()=>{
    const th=170,open=(outerWidth-innerWidth>th)||(outerHeight-innerHeight>th);
    if(open&&!devOpen){devOpen=true;document.documentElement.style.filter='blur(10px)';warn('🔒 偵測到開發者工具，請關閉');}
    else if(!open&&devOpen){devOpen=false;document.documentElement.style.filter='';}
  },800);
  /* 截圖嚇阻：失焦／切到背景時自動模糊，回來就恢復 */
  const shield=()=>{document.documentElement.style.filter='blur(10px)';};
  const unshield=()=>{if(!devOpen)document.documentElement.style.filter='';};
  addEventListener('blur',shield);addEventListener('focus',unshield);
  document.addEventListener('visibilitychange',()=>{document.hidden?shield():unshield();});
})();
</script>
