<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

:root{--bg:#0d1526;--panel:#141e34;--panel2:#121c31;--line:#2c3d63;--gold:#f2c14e;--gold2:#ffd97a;--goldD:#7a5f27;

--txt:#e9eef8;--mut:#8fa0bd;--red:#ef5350;--green:#7ed957;--teal:#38d9c0;--serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif}

body{font-family:var(--sans);color:var(--txt);min-height:100vh;overflow-x:hidden;background:

radial-gradient(900px 600px at 85% -10%,rgba(56,217,192,.10),transparent 60%),

radial-gradient(800px 520px at -10% 110%,rgba(242,148,60,.11),transparent 60%),

linear-gradient(180deg,var(--bg),var(--bg) 40%,var(--panel));background-attachment:fixed}

::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite}

.ember{position:absolute;bottom:-12px;width:4px;height:4px;background:#ffb35c;border-radius:50%;filter:blur(1px);animation:rise linear infinite}

@keyframes tw{50%{opacity:.08}}@keyframes rise{to{transform:translateY(-110vh);opacity:0}}

#fxlayer{position:fixed;inset:0;z-index:98;pointer-events:none}

.floater{position:fixed;z-index:99;font-family:var(--serif);font-weight:900;font-size:24px;pointer-events:none;transform:translateX(-50%);animation:fl 1.05s ease-out forwards}

.floater.good{color:#8ee06a;text-shadow:0 0 12px rgba(126,217,87,.7)}.floater.bad{color:#ff7b72}.floater.crit{color:#ffd97a;font-size:32px}

@keyframes fl{to{transform:translateX(-50%) translateY(-72px);opacity:0}}

.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--goldD);border-radius:12px;

box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(242,193,78,.12)}

.panel2{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:15px;transition:.2s}

.btn{font-family:var(--sans);font-weight:700;letter-spacing:.5px;padding:10px 18px;border-radius:5px;border:1px solid #a37c2c;

background:linear-gradient(180deg,#ffd97a,#e0a63a 55%,#c8862a);color:#3a2703;cursor:pointer;box-shadow:0 3px 0 #7a5514;transition:.15s;position:relative;overflow:hidden}

.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #7a5514,0 10px 22px rgba(242,193,78,.28)}
.btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%);opacity:0}
.btn:active::after{width:200px;height:200px;opacity:1;transition:width .3s,height .3s,opacity .3s}

.btn:active{transform:translateY(1px)}

.btn.ghost{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--txt);border-color:var(--line);box-shadow:0 3px 0 rgba(0,0,0,.4)}

.btn.danger{background:linear-gradient(180deg,#ff8a80,#e5484d 55%,#c73a3f);color:#fff;border-color:#8f272b;box-shadow:0 3px 0 #6e1d20}

.btn.teal{background:linear-gradient(180deg,#7ff0dd,#2aa8a0 60%,#1f7d78);color:#03272a;border-color:#1f7d78;box-shadow:0 3px 0 #145550}

.btn.mini{padding:7px 12px;font-size:13px}.btn.big{width:100%;padding:13px;font-size:16px;margin-top:4px}.btn.dis{opacity:.4;pointer-events:none}

input,textarea,select{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:5px;font-family:var(--sans);font-size:14px;outline:none;transition:.2s;width:100%}

input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.15)}

.hud{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,16,30,.96);border-bottom:1px solid var(--goldD)}

.hudL,.hudR{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.hlogo{font-size:24px;filter:drop-shadow(0 0 8px rgba(242,193,78,.6))}

.hlv{font-family:var(--serif);font-weight:900;color:var(--gold2);font-size:17px}

.htitle{font-family:var(--serif);font-weight:700;color:#cfe0ff;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:5px 10px;border-radius:4px;font-weight:700;font-size:12.5px}

.chip b{color:var(--gold2);font-family:var(--serif)}

.chip.cry b{color:#7ff0dd}.chip.coin b{color:#ffd97a}.chip.gem b{color:#d9a7ff}.chip.honor b{color:#ff9d7a}.chip.qp b{color:#9fd8ff}.chip.sl b{color:#c9a6ff}

.chip.imp{color:#ffd97a;border-color:var(--goldD);animation:pulse 1.6s infinite}

@keyframes pulse{50%{box-shadow:0 0 16px rgba(242,193,78,.45)}}

.bar{height:10px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}

.bar i{display:block;height:100%;background:linear-gradient(90deg,#4caf50,#8ee06a);position:relative;transition:width .5s}

.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:shine 2.4s infinite}

@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.xpb{width:110px}.xpwrap{display:flex;align-items:center;gap:6px}.xpwrap b{font-size:11px;color:var(--mut)}

.hpb i{background:linear-gradient(90deg,#c73a3f,#ff7b72)}.enb i{background:linear-gradient(90deg,#2aa8a0,#67d8c8)}.qpb i{background:linear-gradient(90deg,#2aa8a0,#67d8c8)}

.wrap{max-width:1120px;margin:0 auto;padding:16px 18px 60px;position:relative;z-index:1}

.view{padding:20px;min-height:440px;animation:viewIn .35s ease-out}

@keyframes pop{from{transform:scale(.97);opacity:0}}

.vt{font-family:var(--serif);font-weight:900;font-size:21px;color:var(--gold2);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.vsub{font-size:13px;color:var(--mut);font-family:var(--sans);font-weight:500}

.empty{color:var(--mut);text-align:center;padding:28px 0}

.back{margin-bottom:12px}

.featGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.feat{background:linear-gradient(180deg,var(--panel2),#101a2e);border:1px solid var(--line);border-left:4px solid var(--fc,#888);border-radius:11px;padding:14px 13px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}

.feat:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.45);border-color:var(--fc)}

.feat::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:translateX(-100%);transition:.5s}

.feat:hover::after{transform:translateX(100%)}

.fIco{font-size:26px;display:block;margin-bottom:6px}

.feat b{display:block;font-family:var(--serif);font-size:14.5px}

.feat i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px}
.feat{min-height:92px}
.featCat{font-family:var(--serif);font-weight:900;font-size:15.5px;color:var(--gold2);margin:18px 0 8px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.featCat::before,.featCat::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,130,.35),transparent)}

.subjGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

.subjB{border:none;border-radius:8px;padding:16px 10px;cursor:pointer;color:#fff;font-family:var(--serif);font-weight:900;font-size:16px;transition:.18s;box-shadow:0 4px 0 rgba(0,0,0,.35)}

.subjB:hover{transform:translateY(-4px) scale(1.03);filter:brightness(1.15)}

.unitRow{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--txt);padding:8px 12px;font-size:13.5px;cursor:pointer;border-radius:4px;transition:.15s}

.unitRow:hover{background:rgba(242,193,78,.1);transform:translateX(4px)}

.semT{font-family:var(--serif);color:var(--teal);font-weight:900;font-size:14px;margin:10px 4px 4px}

.qStatus{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

.qCard{margin-bottom:10px}

.qTag{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:900}

.qStem{font-size:17px;line-height:1.8;margin:10px 0 14px;white-space:pre-wrap}

.optBtn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:12px 14px;margin-bottom:7px;border-radius:6px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s}

.optBtn:hover{border-color:var(--gold);transform:translateX(6px);background:rgba(242,193,78,.08)}

.optBtn.sel{border-color:var(--teal);background:rgba(56,217,192,.12)}

.optBtn.ok{border-color:#4caf50;background:rgba(76,175,80,.18);color:#a5f0b5}

.optBtn.no{border-color:#e5484d;background:rgba(229,72,77,.15);color:#ffb4ab}

.optBtn.lock{pointer-events:none;opacity:.85}

.calc{font-family:Consolas,monospace;color:#00ff88;background:#050b14!important}

.resBig{font-family:var(--serif);font-weight:900;font-size:26px;text-align:center;margin:8px 0}

.rwRow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}

.rwChip{background:linear-gradient(180deg,rgba(242,193,78,.12),rgba(0,0,0,.35));border:1px solid var(--goldD);color:var(--gold2);padding:6px 13px;border-radius:99px;font-weight:700;font-size:13px;animation:pop .3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.quote{color:#c9a6ff;font-size:12.5px;text-align:center;margin:8px 0}

.expl{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;margin:10px 0}

.tabRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.tabB{padding:9px 16px;border-radius:5px 5px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--panel2);color:var(--mut);font-weight:700;cursor:pointer;font-size:13.5px;transition:.15s}

.tabB:hover{color:var(--gold2)}

.tabB.on{color:var(--gold2);background:#182338;border-top:2px solid var(--gold)}

.rarN{color:#9ca3af}.rarR{color:#22c55e}.rarSR{color:#3b82f6}.rarSSR{color:#a855f7}.rarUR{color:#f59e0b}

.collIt{display:flex;gap:12px;align-items:center;margin-bottom:8px}

.collIt .pBox{width:52px;height:52px;background:rgba(0,0,0,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}

.collInfo{flex:1;min-width:0}

.skTxt{font-size:11px;color:var(--mut);margin-top:2px}

.pkArena{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}

.pkSide{padding:14px;border-radius:8px;border:1px solid var(--line)}

.pkSide.me{border-color:var(--teal);background:rgba(56,217,192,.05)}

.pkSide.foe{border-color:var(--red);background:rgba(239,83,80,.05)}

.pkName{font-family:var(--serif);font-weight:900;font-size:16px;margin-bottom:8px}

.pkIco{font-size:44px;text-align:center;margin:6px 0;transition:.2s}

.pkIco.hit{animation:hitFx .35s}

.pkIco.atk{animation:atkFx .4s}

@keyframes hitFx{25%{transform:translateX(-9px) scale(.94);filter:brightness(1.7) drop-shadow(0 0 14px #ef5350)}75%{transform:translateX(9px)}}

@keyframes atkFx{30%{transform:translateX(14px) scale(1.08)}}

.pkLog{height:150px;overflow-y:auto;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12.5px;line-height:1.9}

.pkLog .crit{color:var(--gold2);font-weight:900}

.pkLog .dmg{color:#ff9d97}.pkLog .heal{color:#8ee06a}

.flashWin{animation:winFl .8s}

@keyframes winFl{0%,100%{box-shadow:none}50%{box-shadow:0 0 40px rgba(242,193,78,.8)}}

.forgeAnvil{font-size:70px;text-align:center;margin:10px 0;transition:.1s}

.forgeAnvil.strike{animation:strike .3s}

@keyframes strike{30%{transform:scale(.9) rotate(-6deg);filter:brightness(1.8) drop-shadow(0 0 20px #ffb35c)}}

.sparkFx{position:absolute;pointer-events:none;font-size:18px;animation:spark .7s ease-out forwards}

@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

.tblWrap{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-size:13.5px}

th{background:rgba(0,0,0,.3);color:var(--gold2);font-family:var(--serif);padding:9px 11px;text-align:left;border-bottom:2px solid var(--goldD);white-space:nowrap}

td{padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}

tbody tr{transition:.15s}tbody tr:hover td{background:rgba(242,193,78,.05)}

code{background:rgba(0,0,0,.3);border:1px solid var(--line);padding:2px 7px;border-radius:4px;color:var(--teal);font-size:12px}

.rankIt{display:flex;align-items:center;gap:12px;margin-bottom:8px}

.rMed{font-size:22px}.rName{flex:1}.rLv{color:#cfe0ff;font-size:12.5px}.rXp{color:var(--mut);font-size:12px}

.rankIt.top0{border-color:var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.14),transparent)}

.chatBox{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:6px}

/* ── LINE／IG／FB 風格對話氣泡（簡訊類）── */
.chatMsg{display:flex;gap:10px;align-items:flex-end;max-width:100%;animation:pop .25s}
.chatMsg.mine{flex-direction:row-reverse}
.cmAv{flex:0 0 auto;display:flex;align-items:flex-end}
.cmAv img{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.cmCol{display:flex;flex-direction:column;max-width:86%;min-width:0}
.chatMsg.mine .cmCol{align-items:flex-end}
.cmName{font-size:12px;color:var(--mut);margin:0 4px 3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cmName b{color:var(--gold2);font-size:13px}
.chatMsg.admin .cmName b{color:var(--gold)}
.chatMsg.teacher .cmName b{color:#7ea6ff}
.chatMsg.mine .cmName{justify-content:flex-end}
.cTime{color:var(--mut);font-size:11px}
.cmBub{background:rgba(255,255,255,.1);border:1px solid var(--line);color:#e8eefb;border-radius:16px 16px 16px 6px;padding:10px 16px;font-size:15px;line-height:1.6;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chatMsg.mine .cmBub{background:linear-gradient(135deg,#00b894,#00a381);border-color:transparent;color:#fff;border-radius:16px 16px 6px 16px}
.cmBub p{margin:0;font-size:15px;word-break:break-word}
.chatMsg.mine .cmBub p{color:#fff}
.cmBub img{max-width:460px;border-radius:12px;display:block;margin:3px 0;border:1px solid var(--line);cursor:zoom-in}
.cmBub video{max-width:480px;border-radius:12px;display:block;margin:3px 0}
.chatMsg .btn{font-size:11.5px;padding:4px 8px}
.chatMsg.system{align-self:center;display:flex;justify-content:center}
.chatMsg.system .cmCol{max-width:100%;align-items:center}
.chatMsg.system .cmBub{background:rgba(255,255,255,.07);color:var(--mut);border-radius:14px;padding:5px 16px;font-size:13px}
.chatMsg.system .cmBub p{font-size:13px;color:var(--mut)}
/* 👁 上線狀態標籤 */
.onlBadge{font-size:11px;margin-left:6px;padding:1px 8px;border-radius:10px;display:inline-block;vertical-align:middle}
.onlBadge.on{color:#4ade80;background:rgba(74,222,128,.14)}
.onlBadge.off{color:var(--mut);background:rgba(255,255,255,.06)}

.annIt{margin-bottom:12px}.annIt b{font-family:var(--serif);font-size:15.5px;color:var(--gold2)}

.annMeta{display:block;color:var(--mut);font-size:12px;margin:4px 0 6px}.annIt p{font-size:13.5px;line-height:1.7}

.statGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}

.statIt{text-align:center}.statIt span{font-size:11.5px;color:var(--mut);display:block}.statIt b{font-family:var(--serif);font-size:24px;color:var(--gold2)}

.cRow{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;margin-bottom:8px}

.cVal{font-size:11.5px;color:var(--mut);text-align:right}

.abRow{display:flex;align-items:center;gap:10px;margin-bottom:7px}

.abRow .bar{flex:1}

.expIt{margin-bottom:10px}.expIt b{font-family:var(--serif);font-size:15px}

.stepLi{font-size:13px;line-height:1.9;padding-left:6px}

.frIt{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}

.onDot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}

.onDot.on{background:#4caf50;box-shadow:0 0 6px #4caf50}.onDot.off{background:#555}

.pdfWrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.pdfWrap iframe{width:100%;height:520px;border:1px solid var(--line);border-radius:6px;background:#fff}

.terrGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;max-height:300px;overflow-y:auto;padding:6px 4px}

.terrChip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 4px;font-weight:700;cursor:pointer;color:#fff;transition:.15s;text-align:center;background:var(--tc,#333c50);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}

.terrChip .tcNum{font-size:11px;line-height:1.1}.terrChip .tcLv{font-size:9.5px;opacity:.85;font-weight:800}

.terrChip:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15);box-shadow:0 6px 14px rgba(0,0,0,.4)}

.terrChip.done{background:linear-gradient(160deg,#2f6b45,#204d33)!important;border-color:#3c8a5a;cursor:default;color:#cdeed6}

.terrChip.lock{background:#1c2740!important;border-color:var(--line);color:#5b6a86;cursor:not-allowed;box-shadow:none}

.terrChip.next{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(242,193,78,.4);animation:pulse 1.6s infinite}

.terrChip.boss{border-color:var(--gold2)}.terrChip.boss .tcNum{color:#fff;text-shadow:0 0 6px rgba(255,217,122,.8)}

.terrInfo{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

.terrInfo span{flex:1;min-width:220px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--mut);line-height:1.6}

.terrInfo b{color:var(--gold2)}

.alogGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-height:62vh;overflow-y:auto;padding:4px 2px}

.alogCard{aspect-ratio:16/9;display:flex;flex-direction:column;background:linear-gradient(155deg,#1a2540,#101a2e);border:1px solid var(--line);border-left:5px solid var(--fc,#888);border-radius:14px;padding:12px 15px;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:.18s;overflow:hidden;position:relative}

.alogCard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.55);border-color:var(--fc)}

.alogCard.ok{--fc:#4caf50}.alogCard.no{--fc:#e5484d}

.alogTop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}

.alogTop .rsBadge{font-family:var(--serif);font-weight:900;font-size:13px;color:var(--fc)}

.alogTag{padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut);font-weight:700}

.alogTime{margin-left:auto;color:var(--mut);font-size:10.5px}

.alogStem{flex:1;margin:9px 0;font-size:14px;line-height:1.55;color:var(--txt);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

.alogBot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;border-top:1px solid var(--line);padding-top:7px}

.alogBot .ansv{flex:1;min-width:0;color:#cfe0ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.alogBot .sec{color:var(--gold2);font-weight:700;font-family:var(--serif)}

.alogBot .calc{background:rgba(56,217,192,.14);border:1px solid var(--teal);color:var(--teal);padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}

.gshopIt{position:relative;border:1px solid var(--goldD);background:linear-gradient(160deg,#1a2540,#121c31)}

.gshopIt .stockTag{position:absolute;top:-8px;right:10px;background:#e5484d;color:#fff;font-size:10px;padding:2px 9px;border-radius:99px;font-weight:900}

.gshopIt.soldout{opacity:.45}

.tradeIt{border:1px solid var(--line);border-left:4px solid var(--teal)}

.upType{display:inline-block;font-size:10px;font-weight:900;padding:2px 8px;border-radius:99px;margin-left:6px}

.upType.star{background:rgba(201,166,255,.18);color:#c9a6ff;border:1px solid #6a4fa0}

.upType.enh{background:rgba(255,157,122,.15);color:#ff9d7a;border:1px solid #8a4a35}

#login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;max-width:1060px;margin:0 auto;padding:44px 22px;position:relative;z-index:1}

.emb{font-size:84px;width:max-content;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(242,193,78,.45))}

@keyframes bob{50%{transform:translateY(-8px)}}

.logoT{font-family:var(--serif);font-weight:900;font-size:clamp(32px,5vw,50px);line-height:1.15;color:#f6d78a;text-shadow:0 2px 0 #7a5514,0 4px 18px rgba(242,193,78,.35);margin-top:10px}

.verRow{display:flex;gap:8px;margin:14px 0 20px}

.verChip{border:1px solid var(--goldD);color:var(--gold2);padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700}

.verChip.star{background:linear-gradient(90deg,#c8862a,#e8b64c);color:#3a2703;border:none}

.featL{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}

.featL li{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line);padding:9px 13px;border-radius:5px;transition:.2s}

.featL li:hover{transform:translateX(6px);border-color:var(--goldD)}

.featL b{font-size:20px}.featL strong{color:var(--gold2);display:block;font-family:var(--serif)}

.featL span{font-size:12.5px;color:var(--mut);line-height:1.5}

.lgCard{padding:28px 26px}

.cor{position:absolute;width:20px;height:20px;border-color:var(--gold);border-style:solid;border-width:0;z-index:2}

.tl{top:-2px;left:-2px;border-top-width:3px;border-left-width:3px}.tr{top:-2px;right:-2px;border-top-width:3px;border-right-width:3px}

.bl{bottom:-2px;left:-2px;border-bottom-width:3px;border-left-width:3px}.br{bottom:-2px;right:-2px;border-bottom-width:3px;border-right-width:3px}

.lgT{font-family:var(--serif);font-weight:900;font-size:21px;color:var(--gold2)}

.lgSub{color:var(--mut);margin:6px 0 14px;font-size:13.5px}

.roleTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}

.rtab{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--mut);padding:10px 4px;border-radius:5px;cursor:pointer;font-weight:700;font-size:12.5px;line-height:1.6;transition:.15s;font-family:var(--sans)}

.rtab:hover{color:var(--gold2);transform:translateY(-2px)}

.rtab.on{background:linear-gradient(180deg,#2a3a63,#1c2a4c);border-color:var(--gold);color:var(--gold2);box-shadow:0 0 12px rgba(242,193,78,.2)}

.lgHint{margin-top:12px;font-size:12.5px;color:var(--mut);background:rgba(0,0,0,.25);border:1px solid var(--line);padding:9px 12px;border-radius:5px}

.lgHint b{color:var(--teal)}

.lgNote{margin-top:8px;font-size:12px;color:var(--mut)}

.lgReset{margin-top:12px;font-size:12px}.lgReset a{color:#ff8a80;text-decoration:none}

.shake{animation:shk .4s}

@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.mwrap{position:fixed;inset:0;background:rgba(4,8,16,.78);z-index:110;display:flex;align-items:center;justify-content:center;padding:20px}

.mpanel{width:100%;max-width:480px;padding:22px;animation:pop .25s;max-height:88vh;overflow-y:auto}

.mt{font-family:var(--serif);font-weight:900;color:var(--gold2);font-size:19px;margin-bottom:6px}

.msub{color:var(--mut);font-size:12.5px;margin-bottom:12px}

.mlab{display:block;font-size:12.5px;color:var(--mut);margin-bottom:11px;font-weight:700}

.mlab input,.mlab select{margin-top:5px}

.mBtns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

#toasts{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px}

.toast{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--goldD);border-left:4px solid var(--gold);padding:11px 15px;border-radius:5px;font-weight:700;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .25s;max-width:330px}

.toast.bad{border-left-color:var(--red)}

.toast.out{opacity:0;transform:translateX(30px);transition:.4s}

@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes slideInL{from{transform:translateX(-120px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInR{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes critShake{0%,100%{transform:translate(0)}10%{transform:translate(-6px,4px)}20%{transform:translate(6px,-4px)}30%{transform:translate(-4px,6px)}40%{transform:translate(4px,-6px)}50%{transform:translate(-2px,2px)}}
@keyframes victoryPop{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes urGlow{0%,100%{box-shadow:0 0 15px rgba(245,158,11,.4),0 0 30px rgba(245,158,11,.2)}50%{box-shadow:0 0 30px rgba(245,158,11,.8),0 0 60px rgba(245,158,11,.4)}}
@keyframes urReveal{0%{transform:scale(0) rotate(-180deg);opacity:0;filter:brightness(3)}60%{transform:scale(1.2) rotate(10deg);opacity:1;filter:brightness(2)}100%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1)}}
@keyframes goldRain{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes modalIn{from{transform:translateY(40px) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes levelUp{0%{transform:scale(0);opacity:0}40%{transform:scale(1.3);opacity:1}70%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes rewardDrop{0%{transform:translateY(-60px) scale(1.5);opacity:0}60%{transform:translateY(10px) scale(1);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes enhSuccess{0%{transform:scale(1);box-shadow:none}50%{transform:scale(1.08);box-shadow:0 0 20px rgba(242,193,78,.6)}100%{transform:scale(1);box-shadow:none}}
@keyframes enhFail{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.pkSlideL{animation:slideInL .5s ease-out}
.pkSlideR{animation:slideInR .5s ease-out}
.critShake{animation:critShake .5s}
.victoryPop{animation:victoryPop .6s ease-out}
.urCard{animation:urReveal .8s ease-out,urGlow 2s infinite 0.8s}
.modalAnim .mpanel{animation:modalIn .3s ease-out}
.fadeIn{animation:fadeIn .3s}
.enhOk{animation:enhSuccess .6s}
.enhNo{animation:enhFail .5s}
.pkSkillFx{position:absolute;font-size:28px;pointer-events:none;animation:victoryPop .5s ease-out forwards;z-index:5}
@keyframes goldFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.gachaFlash{position:fixed;inset:0;z-index:150;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,217,122,.9),rgba(242,193,78,.4) 42%,transparent 75%);animation:goldFlash .95s ease-out forwards}
@keyframes ssrReveal{0%{transform:scale(0) rotate(120deg);opacity:0;filter:brightness(2.6)}60%{transform:scale(1.14) rotate(-6deg);opacity:1;filter:brightness(1.8)}100%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1)}}
@keyframes ssrGlow{0%,100%{box-shadow:0 0 12px rgba(168,85,247,.4)}50%{box-shadow:0 0 26px rgba(168,85,247,.85),0 0 48px rgba(168,85,247,.35)}}
.ssrCard{animation:ssrReveal .7s ease-out,ssrGlow 2.2s infinite .7s}
@keyframes hiBanner{0%{transform:translateX(-50%) scale(0);opacity:0}45%{transform:translateX(-50%) scale(1.25);opacity:1}70%{transform:translateX(-50%) scale(.96)}100%{transform:translateX(-50%) scale(1);opacity:1}}

for(const d of [[1,0],[0,1],[1,1],[1,-1]]){
for(const p of [2,1]){
let cnt=0;
for(let k=1;k<5;k++){const nx=x+d[0]*k,ny=y+d[1]*k;if(nx<0||nx>=15||ny<0||ny>=15||b[ny*15+nx]!==p)break;cnt++}
for(let k=1;k<5;k++){const nx=x-d[0]*k,ny=y-d[1]*k;if(nx<0||nx>=15||ny<0||ny>=15||b[ny*15+nx]!==p)break;cnt++}
sc+=(p===2?1.1:1)*Math.pow(10,cnt);
}}
sc+=Math.random();
if(sc>bs){bs=sc;best=i}}
return best}

<script>
/* ════════ Supabase 雲端同步層（完整後端）════════
   1. 到 https://supabase.com 建立專案
   2. 在 SQL Editor 執行 supabase_setup.sql
   3. 把下面兩行換成你專案的 Project URL 與 anon public key（Settings → API）
*/
const SUPA_URL=location.origin;      /* 自動跟著服務網址：搬機/外網零修改 */
const SUPA_ON=true;/* 自架後端允許 http（區網）*/
const SUPA_SKIP=['ADV9_SES','ADV9_LOCAL','ADV9_WTOKEN'];/* session 與本機畢業帳號僅存本機，不上雲 */
const SUPA_KEY='';/* 金鑰自動從後端 /rest/v1/key 取得（svcKey 流程）；此處留空即代表「尚未取得」 */
function supaHeaders(){const h={'Content-Type':'application/json'};if(SUPA_KEY)h['apikey']=SUPA_KEY;if(WTOKEN)h['x-adv9-token']=WTOKEN;if(/^eyJ/.test(SUPA_KEY))h['Authorization']='Bearer '+SUPA_KEY;return h}/* 新版 sb_publishable_ 金鑰非 JWT，僅送 apikey；舊版 anon JWT(eyJ...) 才加 Bearer */
/* ☁️ 媒體雲端儲存：照片/影片上傳到 Supabase Storage（media 桶），訊息只存網址 → 突破 3MB 限制
   一次性設定：到 Supabase SQL Editor 執行桌面的 supabase_storage_setup.sql 建立 media 桶 */
const MEDIA_BUCKET='media',MEDIA_MAX=50*1024*1024; /* 單檔上限 50MB */
/* 上傳進度條 UI：upProg(百分比,文字)，傳 null 關閉 */
function cloudUpload(f,done,fail,prog){ /* prog(百分比)：上傳進度回呼（用 XHR 才拿得到即時進度） */
if(!SUPA_ON)return fail&&fail('no-supa');
const ext=((f.type&&f.type.split('/')[1])||'bin').replace(/[^\w]/g,'').slice(0,8);
const name=Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
const x=new XMLHttpRequest();
x.open('POST',SUPA_URL+'/storage/v1/object/'+MEDIA_BUCKET+'/'+name);
const h=mediaHeaders(f.type||'application/octet-stream');for(const k in h)x.setRequestHeader(k,h[k]);
if(x.upload&&prog)x.upload.onprogress=e=>{if(e.lengthComputable)prog(Math.round(e.loaded/e.total*100))};
x.onload=()=>{if(x.status>=200&&x.status<300)done('/storage/v1/object/public/'+MEDIA_BUCKET+'/'+name);else fail&&fail('HTTP '+x.status)};
x.onerror=()=>fail&&fail('network');
x.send(f);
}
function cloudDelete(url){ /* 盡力而為刪除雲端檔案（過期清理用），非雲端網址自動略過 */
try{if(typeof url!=='string')return;
if(url.indexOf('gd:')===0)return gdDelete(url); /* Google Drive 檔 */
const p='/storage/v1/object/public/'+MEDIA_BUCKET+'/';
if(url.indexOf(p)<0)return;
fetch(SUPA_URL+'/storage/v1/object/'+MEDIA_BUCKET+'/'+url.split(p)[1],{method:'DELETE',headers:mediaHeaders()}).catch(()=>{})}catch(e){}
}
/* 📂 Google Drive 影片儲存（15GB）：透過你自己部署的 Apps Script 橋接上傳到指定資料夾
   設定方法見桌面「google雲端設定說明.txt」；部署完把 /exec 網址貼到下面 GDRIVE_URL 即自動啟用（影片改存 Drive，照片仍走 Supabase） */
const GDRIVE_MAX=30*1024*1024; /* Drive 單支影片上限 30MB（base64 傳輸限制） */
function gdUpload(f,done,fail,prog){
if(!GDRIVE_URL)return fail&&fail('no-gdrive');
const r=new FileReader();
r.onload=e=>{
const x=new XMLHttpRequest();
x.open('POST',GDRIVE_URL); /* 不設 Content-Type → 簡單請求，避開 Apps Script 不支援的 CORS 預檢 */
if(x.upload&&prog)x.upload.onprogress=ev=>{if(ev.lengthComputable)prog(Math.round(ev.loaded/ev.total*100))};
x.onload=()=>{try{const j=JSON.parse(x.responseText);if(j&&j.id)return done('gd:'+j.id)}catch(_){}fail&&fail('bad-response')};
x.onerror=()=>fail&&fail('network');
x.send(JSON.stringify({action:'up',name:'adv9_'+Date.now(),type:f.type||'video/mp4',data:e.target.result.split(',')[1]}));
};
r.readAsDataURL(f);
}
/* 帳號清單防呆：VPS 回傳空清單或只剩主管理員時，拒絕覆蓋本機帳號（避免教師帳號「消失」） */
function applyUsersFromServer(v){
  try{
    const arr=Array.isArray(v)?v:null; if(!arr)return false;
    if(arr.length===0){if(typeof toast==='function')toast('⚠️ VPS 回傳空的帳號清單，已保留本機帳號避免誤刪','bad');return false}
    let local=[];try{local=JSON.parse(localStorage.getItem('ADV9_USERS')||'[]')||[]}catch(e){}
    if(arr.length===1&&local.length>1){if(typeof toast==='function')toast('⚠️ VPS 目前僅剩主管理員帳號，已保留本機教師/學生帳號','bad');return false}
    localStorage.setItem('ADV9_USERS',JSON.stringify(arr));return true;
  }catch(e){return false}
}
/* 啟動時同步載入雲端資料（阻塞式，確保主程式讀到最新全服資料） */
if(SUPA_ON){try{
const x=new XMLHttpRequest();
x.open('GET',SUPA_URL+'/rest/v1/adv9_kv?select=k,v',false);
const H=supaHeaders();for(const hk in H)x.setRequestHeader(hk,H[hk]);
x.send();
if(x.status===200){JSON.parse(x.responseText).forEach(row=>{if(SUPA_SKIP.includes(row.k))return;if(row.k==='ADV9_USERS'){applyUsersFromServer(row.v);return}try{localStorage.setItem(row.k,JSON.stringify(row.v))}catch(e){}});window._supaLoaded=true;console.log('☁️ Supabase 雲端資料已載入')}
else console.warn('Supabase 回應異常('+x.status+')，改用本地資料');
}catch(e){console.warn('Supabase 載入失敗，改用本地資料',e)}}
/* 寫入去抖動批次上傳 */
const _supaQ={};let _supaT=null;
function _curSyncRole(){try{const u=me();return u?u.role:null}catch(e){return null}}
function supaPush(k,v){
if(!SUPA_ON||SUPA_SKIP.includes(k))return;
if(k==='ADV9_USERS'){
  /* 只有管理員/教師能同步帳號清單；學生與未登入一律靜默略過（伺服器會回 403）*/
  const r=_curSyncRole();
  if(r!=='admin'&&r!=='teacher')return;
  fetch(SUPA_URL+'/rest/v1/admin/users/sync',{method:'POST',headers:supaHeaders(),body:JSON.stringify({users:v})}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status)}).catch(e=>{console.warn('VPS account save failed',e);if(!window._supaUsersWarnAt||Date.now()-window._supaUsersWarnAt>30000){window._supaUsersWarnAt=Date.now();const why=(e&&e.message)?e.message:'無法連線';toast('⚠️ 帳號同步至 VPS 失敗（'+why+'），請檢查連線後重試','bad')}});
  return;
}
if(k==='ADV9_APIKEYS'){
  if(_curSyncRole()!=='admin')return; /* 金鑰同步僅限管理員 */
  fetch(SUPA_URL+'/rest/v1/admin/api_keys',{method:'POST',headers:supaHeaders(),body:JSON.stringify(v)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status)}).catch(e=>{console.warn('VPS API key save failed',e);toast('⚠️ API 金鑰同步至 VPS 失敗','bad')});
  return;
}
_supaQ[k]=v;
if(_supaT)return;
_supaT=setTimeout(()=>{
_supaT=null;
const rows=Object.keys(_supaQ).map(kk=>({k:kk,v:_supaQ[kk],updated_at:new Date().toISOString()}));
for(const kk in _supaQ)delete _supaQ[kk];
fetch(SUPA_URL+'/rest/v1/adv9_kv',{method:'POST',headers:Object.assign(supaHeaders(),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(rows)}).catch(e=>console.warn('Supabase 同步失敗',e));
},400);
}
function flushSupaQ(){ /* 立即上傳佇列（私訊送出用，不等待 400ms debounce） */
if(!_supaQ||!_supaT)return;
clearTimeout(_supaT);_supaT=null;
const rows=Object.keys(_supaQ).map(kk=>({k:kk,v:_supaQ[kk],updated_at:new Date().toISOString()}));
for(const kk in _supaQ)delete _supaQ[kk];
if(rows.length)fetch(SUPA_URL+'/rest/v1/adv9_kv',{method:'POST',headers:Object.assign(supaHeaders(),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(rows)}).catch(e=>console.warn('Supabase 同步失敗',e));

/* 👁 上線狀態：每 25 秒向伺服器報到，並取得在線名單（含隱藏上線的隱私設定） */
async function heartbeat(){
  if(!SUPA_ON||!WTOKEN||WTOKEN.indexOf('local_')===0)return;
  try{
    const u=me();
    const r=await fetch(SUPA_URL+'/rest/v1/user/heartbeat',{method:'POST',headers:supaHeaders(),body:JSON.stringify({hide:!!(u&&u.prof&&u.prof.hideOnline)})});
    if(!r.ok)return;

/* 📨 即時訊息引擎：每 4 秒輕量輪詢（只抓 PM/交易/PK），
   私聊視窗開著 → 立刻刷新；新訊息/新請求 → 通知彈窗 + 未讀徽章 */
let _pmReadAt={},_alertedPm={},_alertedTrade=new Set(),_alertedDuel=new Set(),_fastT=null;
try{_pmReadAt=JSON.parse(localStorage.getItem('ADV9_PM_READ')||'{}')||{}}catch(e){}
function pmUnread(){
  const u=me();if(!u)return {};
  try{const pm=get(LS.pm,{});const out={};
    Object.keys(pm).forEach(k=>{
      if(!k||k.indexOf(u.id)===-1)return;
      const fid=k.split('|').find(x=>x!==u.id);if(!fid)return;
      const last=((pm[k]||[]).slice(-1))[0];
      const lastT=(_pmReadAt[k]||0);
      const n=((pm[k]||[]).filter(m=>m&&m.from!==u.id&&m.t>(lastT||0))).length;
      if(n>0)out[fid]={n,last};
    });
    return out;
  }catch(e){return {}}
}
function pmUnreadTotal(){const o=pmUnread();return Object.keys(o).reduce((s,f)=>s+o[f].n,0)}
function markPmRead(fid){
  const u=me();if(!u)return;
  _pmReadAt[pmId(u.id,fid)]=Date.now();

/* 📡 共用處理：把伺服器送來的 KV 資料套用到本地（fastSync 輪詢與 SSE 即時推送共用） */
function applyKvRows(rows){
  if(!Array.isArray(rows))return;
  rows.forEach(row=>{
    if(!row||!row.k)return;
    if(row.k==='ADV9_USERS'){try{applyUsersFromServer(row.v)}catch(e){}return}
    if(SUPA_SKIP.includes(row.k))return;
    if(_supaQ[row.k]!==undefined)return;
    try{
      const cur=localStorage.getItem(row.k);const nv=JSON.stringify(row.v);
      if(cur!==nv){
        localStorage.setItem(row.k,nv);
        if(row.k==='ADV9_PM'){if(typeof onPmUpdate==='function')onPmUpdate()}
        else if(row.k==='ADV9_GROUPS'){if(typeof onGroupUpdate==='function')onGroupUpdate(row.v)}
        else if(row.k==='ADV9_TRADES'){if(typeof onTradeUpdate==='function')onTradeUpdate(row.v)}
        else if(row.k==='ADV9_DUELS'){if(typeof onDuelUpdate==='function')onDuelUpdate(row.v)}
      }
    }catch(e){}
  });
}
/* 📡 SSE 即時長連線：伺服器一有變更立刻推送（IG/FB 式秒收，完全不閃不重載） */
function startStream(){
  try{
    if(_es){_es.close();_es=null}
    if(!SUPA_ON||!WTOKEN||WTOKEN.indexOf('local_')===0)return;
    _es=new EventSource(SUPA_URL+'/rest/v1/stream?token='+encodeURIComponent(WTOKEN));
    _es.addEventListener('kv',function(e){try{applyKvRows(JSON.parse(e.data))}catch(x){}});
  }catch(e){}
}
function fastSync(){
  const u=me();if(!u||!SUPA_ON||!WTOKEN||WTOKEN.indexOf('local_')===0)return;

    if(!r.ok)return null;

function onGroupUpdate(v){

function onPmUpdate(){

function bankQ(subj,unit,diff){

const tier=diff>=50?'困難':'簡單';

const _mu=(typeof me==='function'&&me())?me():null;const g=_mu&&_mu.g?_mu.g:null;

if(subj==='數學'&&Math.random()<.5)return procMathQ(tier); /* 數學半數改用隨機出題器，避免題庫太小一直重複 */

try{const qs=BANK[subj][unit][tier];if(qs&&qs.length){

const unseen=g?qs.filter(q=>!qSeenHas(g,q)):qs; /* 優先出沒出過的題 */

if(!unseen.length){if(subj==='數學')return procMathQ(tier); /* 數學全出過→改隨機出題器，不重複 */

if(g){g.qSeen=(g.qSeen||[]).filter(h=>!qs.some(q=>qHash(q['題目'])===h));saveU(_mu)}} /* 其餘科目全部出過則重置本單元輪迴 */

return shuffleQ(JSON.parse(JSON.stringify(pick(unseen.length?unseen:qs))))}}catch(e){}

return fallbackQ(subj,unit,tier);

}

/* 收藏等級（無上限）：每級技能效果 +2%；舊存檔無 collLv 時預設 Lv.1 */



function effOf(g){

const e={};const add=(o,m)=>{for(const k in o){const v=o[k];if(typeof v==='boolean')e[k]=true;else if(k==='pity_reduce'||k==='quality_up')e[k]=Math.max(e[k]||0,v);/* 保底減抽與品質提升為固定效果，不隨星級倍率縮放 */else e[k]=(e[k]||0)+v*m}};

for(const cat of ['character','pet','anime','teammate']){const n=g.equip[cat];if(!n)continue;const it=findIt(cat,n);if(!it)continue;

const merged={};it.sk.forEach(s=>{for(const k in s[2]){const v=s[2][k];if(typeof v==='boolean')merged[k]=true;else merged[k]=(merged[k]||0)+v}});

add(merged,(CFG.STAR_BONUS[g.stars[n]||1]||1)*(g.awaken.includes(n)?1.5:1)*(1+(collLvOf(g,n)-1)*.02));}

const tt=TITLES.find(t=>t.id===g.equippedTitle);if(tt)add(tt.bonus,1);

const gd=guildOf(g);if(gd)add({all_exp_bonus:Math.min(10,gd.level||1)*.01},1); /* 公會加成：每級全經驗+1%（最高 10 級） */

return e;

}

const isEarly=()=>{const h=new Date().getHours();return h>=6&&h<8};

function rewardOn(g){if(!sysCfg().timeLock)return true;const h=new Date().getHours(),wd=new Date().getDay()<5;return wd?(h>=6&&h<22):(h>=6&&h<23)} /* 時間鎖由管理員全域設定 */

const timeStatus=g=>!sysCfg().timeLock?'🔓 獎勵解鎖':rewardOn(g)?(isEarly()?'🌅 早鳥加成中':'🟢 獎勵開放中'):'🔴 獎勵關閉';



function power(g){

let p=g.lv*10;

g.weapons.forEach(w=>{p+=(CFG.QBASE[w.q]||5)+(w.lv||0)*8});

const e=effOf(g);let s=0;for(const k in e){const v=e[k];if(typeof v==='number'&&v>0)s+=v}p+=Math.floor(s*50);

for(const n in g.stars)p+=g.stars[n]*15;

for(const n in (g.collLv||{}))p+=((g.collLv[n]||1)-1)*5; /* 收藏等級加成戰力 */

if(g.potion.at&&(Date.now()-new Date(g.potion.at))/60000<10)p+=g.potion.bonus;

return p;

}

function runPromotion(times){

times=times||1;

const us=get(LS.users,[]);let promoted=0,grads=0;

for(let t=0;t<times;t++){

/* 學生班級 +1；九年級升級則畢業標記（轉入校友/畢業存檔，保留帳號與進度）*/

us.forEach(x=>{

if(x.role!=='student'||x.graduated||!x.classId)return;

const nid=promoteClassId(x.classId);

if(nid==='GRAD'){x.graduated=true;x.gradYear=acadYear();grads++}

else if(nid){x.prevClassId=x.classId;x.classId=nid;promoted++}

});

/* 班級清單與名稱同步升級 */

const cls=get(LS.classes,{ids:[],names:{}});const nids=[];const nnames={};

cls.ids.forEach(id=>{const nid=promoteClassId(id);

if(nid&&nid!=='GRAD'){if(!nids.includes(nid)){nids.push(nid);nnames[nid]=promoteNameOnce(cls.names[id]||nid)}}

else if(!nid){if(!nids.includes(id)){nids.push(id);nnames[id]=cls.names[id]||id}}

});

/* 自動補齊新七年級班級（供新生匯入）*/

cls.ids.forEach(id=>{const m=String(id).match(/^7(\d+)(.*)$/);if(m){const sid='7'+m[1]+m[2];if(!nids.includes(sid)){nids.push(sid);nnames[sid]=cls.names[id]||sid}}});

cls.ids=nids.sort();cls.names=nnames;set(LS.classes,cls);

/* 教師管理班級同步升級 */

us.forEach(x=>{if(x.managedClassIds&&x.managedClassIds.length){x.managedClassIds=x.managedClassIds.map(id=>{const nid=promoteClassId(id);return (nid&&nid!=='GRAD')?nid:id}).filter((v,i,a)=>a.indexOf(v)===i)}});

}

set(LS.users,us);

return{promoted,grads};

}

function examDate(){ /* 預設算法：國中教育會考≈當學年度隔年 5 月第三個週六（AI 查到確切日期時優先用 AI）*/

const cache=get('ADV9_EXAMDATE',null);const wantY=acadYear()+1;

if(cache&&cache.year===wantY&&cache.date){const d=new Date(cache.date);if(!isNaN(d))return d}

const y=wantY;const d=new Date(y,4,1);const firstSat=1+((6-d.getDay())+7)%7;

return new Date(y,4,firstSat+14);

}

/* 🤖 讓 AI 幫忙查今年會考日期（每年只查一次，結果快取；查不到就用預設算法）*/

async function refreshExamDateAI(force){

const wantY=acadYear()+1;const cache=get('ADV9_EXAMDATE',null);

if(!force&&cache&&cache.year===wantY&&cache.src==='ai')return cache; /* 今年已查過 */

try{

const prompt='請告訴我台灣 '+wantY+' 年「國中教育會考」的正式考試日期（通常在 5 月，為連續兩天的週六日）。只回傳第一天的日期，格式嚴格為 YYYY-MM-DD，不要任何其他文字。';

const res=await callGemini(prompt,'你是台灣教育資訊助手，只回傳 YYYY-MM-DD 日期。');

const m=String(res||'').match(/(\d{4})-(\d{2})-(\d{2})/);

if(m){const iso=m[1]+'-'+m[2]+'-'+m[3];const d=new Date(iso);

if(!isNaN(d)&&+m[1]===wantY){const rec={year:wantY,date:iso,src:'ai'};set('ADV9_EXAMDATE',rec);return rec}}

}catch(e){}

const rec={year:wantY,date:examDate().toISOString().slice(0,10),src:'est'};set('ADV9_EXAMDATE',rec);return rec; /* 退回預設算法 */

}

/* 🔁 傳承轉生（New Game+）：重置等級與貨幣，保留收藏/成就/好友，每次轉生永久加成 */

function rebirth(){

const u=me(),g=u.g;

if(!u.graduated)return toast('🔁 傳承轉生限畢業校友使用','bad');

if(!confirm('🔁 傳承轉生：等級、經驗、金幣、水晶將重置，但保留全部收藏、成就、好友，並永久獲得全經驗+10%、掉落+5%（可累加）。確定？'))return;

g.rebirth=(g.rebirth||0)+1;

g.lv=1;g.xp=0;g.needXp=CFG.needXp(1);g.gold=0;g.crystal=0;g.combo=0;

saveU(u);closeModal();hud();toast('🔁 第 '+g.rebirth+' 次轉生完成！永久加成：全經驗+'+(g.rebirth*10)+'%・掉落+'+(g.rebirth*5)+'%');vHome();

}

function gradLeaveServer(){

u.localOnly=true;

const arr=get(LS.local,[]);if(!arr.find(x=>x.id===u.id))arr.push(u);set(LS.local,arr); /* 存入本機（不上雲）*/

const us=get(LS.users,[]).filter(x=>x.id!==u.id);set(LS.users,us); /* 從雲端共享名單移除，釋放後端 */

set(LS.ses,{u:u.username,local:true});

closeModal();toast('📴 已轉為本機帳號，資料不再佔用後端。請保管下載的存檔！');enter();

}

async function doLogin() {
  const un = $('#lgUser').value.trim();
  const pw = $('#lgPass').value;
  if(!validUsername(un)){fail('⚠️ 帳號格式不正確（僅限英數底線點，2～40 字）');return} /* 🛡️ 防注入：帳號格式驗證 */
  if(!pw||pw.length>100){fail('⚠️ 請輸入密碼');return}
  const _loc=get(LS.local,[]).find(x=>x.username===un); /* 📴 本機畢業帳號：直接本地登入，不靠雲端 */
  if(_loc){set(LS.ses,{u:un,local:true});enter();return}
  if(!SUPA_ON&&isMasterLogin(un,pw)){ /* 👑 離線模式才走本機主管；連線時改由伺服器雜湊驗證發 token */
    const us=get(LS.users,[]);let a=us.find(x=>x.username===MASTER_ADMIN.user);
    if(!a){a={id:MASTER_ADMIN.user,username:MASTER_ADMIN.user,name:MASTER_ADMIN.name,role:'admin',password:'',pwHash:MASTER_ADMIN.hash,master:true,isSchoolAdmin:true,createdAt:new Date().toISOString(),g:null};us.push(a)}
    else{a.role='admin';a.master=true;a.password='';a.pwHash=MASTER_ADMIN.hash;a.isSchoolAdmin=true}
    set(LS.users,us);set(LS.ses,{u:MASTER_ADMIN.user});enter();return;
  }

  try {
    // 先嘗試本地伺服器 API（更可靠）
    let acc = null;
    let supaFailed = false;

    // 方法 1：呼叫本地伺服器 API
    try {
      const srvRes = await fetch(SUPA_URL + '/rest/v1/rpc/login_user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_username: un, p_password: pw })
      });
      console.log('[LOGIN] Server response:', srvRes.status, srvRes.statusText);
      if (srvRes.ok) {
        const srvData = await srvRes.json();
        console.log('[LOGIN] Server data:', srvData);
        if (srvData && srvData.token) {
          acc = srvData;
        }
      } else {
        const errText = await srvRes.text();
        console.error('[LOGIN] Server error:', errText);
      }
    } catch(e) {
      console.error('[LOGIN] Fetch failed:', e.message);
      supaFailed = true;
    }

    // 方法 2：如果本地 API 失敗，嘗試 Supabase
    if (!acc) {
      try {
        const response = await fetch(
          SUPA_URL + '/rest/v1/rpc/login_user',
          {
            method: 'POST',
            headers: supaHeaders(),
            body: JSON.stringify({ p_username: un, p_password: pw })
          }
        );
        if (response.ok) {
          const data = await response.json();
          if (data && data.token) acc = data;
        }
      } catch(e) { supaFailed = true; }
    }

    // 方法 3：完全離線模式 - 使用 localStorage
    if (!acc) {
      const localUser = get(LS.users, []).find(x => x.username === un);
      if (localUser && localUser.password === pw) {
        acc = { ...localUser, token: 'local_' + Date.now() };
      }
    }

    if (!acc) {
      const errMsg = supaFailed ? '伺服器無法連線（' + SUPA_URL + '）' : '帳號或密碼錯誤';
      fail('⚠️ 登入失敗：' + errMsg);
      console.error('[LOGIN] All methods failed. SUPA_ON=' + SUPA_ON + ', SUPA_URL=' + SUPA_URL + ', supaFailed=' + supaFailed);
      return;
    }
    if(acc&&acc.token){WTOKEN=acc.token;try{localStorage.setItem('ADV9_WTOKEN',acc.token)}catch(e){};await loadVpsPrivateData()} /* 🎫 存登入 token 供後續寫入授權 */

    // ⭐ 終極防護：確保 g 永遠完整
    if (acc.game_data) {
      acc.g = acc.game_data;
      // 補齊所有可能缺失的關鍵欄位
      if (!acc.g.weapons) acc.g.weapons = [];
      if (!acc.g.stats) acc.g.stats = { total: 0, correct: 0, maxCombo: 0, hardCorrect: 0, retry: 0, enhance: 0, missions: 0, subj: {}, milestones: [] };
      if (!acc.g.owned) acc.g.owned = { character: [], pet: [], anime: [], teammate: [] };
      if (!acc.g.equip) acc.g.equip = { character: null, pet: null, anime: null, teammate: null };
      if (!acc.g.gacha) acc.g.gacha = { total: 0, sinceSR: 0, sinceSSR: 0, sinceUR: 0, hist: [] };
      // 其他欄���可以繼���補，���至��� weapons 是必須的
    } else if (acc.role === 'student') {
      acc.g = newGame(); // 如果完全沒有遊戲資料，直接給新的
    } else {
      acc.g = null;
    }
    delete acc.game_data;

    // 身份檢查
    if (PORTAL === 'admin' && acc.role !== 'admin') {
      fail('⚠️ 此入口僅供管理員登入，請改用老師或學生登入器');
      return;
    }
    if (PORTAL === 'teacher' && acc.role !== 'teacher') {
      fail('⚠️ 此入口僅供老師登入，請改用正確的登入器');
      return;
    }
    if (PORTAL === 'student' && acc.role !== 'student') {
      fail('⚠️ 此入口僅供學生登入，請改用正確的登入器');
      return;
    }
    if (PORTAL === 'staff' && acc.role === 'admin') {
      fail('⚠️ 管理員請使用管理員登入器');
      return;
    }

    // ⭐ 強制同步到本機（覆蓋）
    let localUsers = get(LS.users, []);
    const priorUser = localUsers.find(x => x.username === acc.username) || {};
    const newUser = {
      ...priorUser,
      id: acc.id || acc.username,
      username: acc.username,
      name: acc.name || priorUser.name || acc.username,
      role: acc.role,
      password: acc.password || priorUser.password || '',
      classId: acc.class_id || priorUser.classId || null,
      managedClassIds: Array.isArray(acc.managedClassIds) ? acc.managedClassIds : (priorUser.managedClassIds || []),
      isSchoolAdmin: acc.isSchoolAdmin !== undefined ? !!acc.isSchoolAdmin : !!priorUser.isSchoolAdmin,
      prof: acc.prof || priorUser.prof || null,
      g: acc.g,
      createdAt: acc.created_at || priorUser.createdAt || new Date().toISOString()
    };
    const existingIndex = localUsers.findIndex(x => x.username === acc.username);
    if (existingIndex !== -1) {
      localUsers[existingIndex] = newUser;
    } else {
      localUsers.push(newUser);
    }
    set(LS.users, localUsers);

    // ⭐ 設置 session（這是關鍵）
    set(LS.ses, { u: acc.username, imp: false });
    startHeartbeat(); /* 👁 開始上線狀態心跳 */
    startFastSync(); /* 📨 開始即時訊息輪詢 */

    // 登入成功後續
    $('#lgPass').value = '';
    loginFX(acc.name);
    setTimeout(() => {
      enter();
      toast('⚔️ 歡迎回來，' + acc.name + '！');
      if (acc.role === 'student') {
        const sr = checkSign(acc.g);
        saveU(acc);
        if (sr) openModal('...');
      }
    }, 750);
  } catch (error) {
    fail('⚠️ ' + error.message);
  }
}

async function loadLangPack(code){
  /* v4.1：每語言一包 js/langpacks/<code>.js，載入後即時出題（不依賴 AI）*/
  try{
    if(!window.LANG_PACKS)window.LANG_PACKS={};
    if(!window.LANG_PACKS[code])await needJs(['js/langpacks/'+code+'.js']);
    if(!window.LANG_PACKS[code])return null;
    return langQFromPack(code,window.LANG_PACKS[code]);
  }catch(e){return null}
}
function langQFromPack(code,words){
  if(!words||!words.length)return null;
  const idx=Math.floor(Math.random()*words.length);
  const pair=words[idx];
  const others=words.filter((p,i)=>i!==idx&&p[1]!==pair[1]);
  const picks=[pair].concat(others.sort(()=>Math.random()-0.5).slice(0,3)).sort(()=>Math.random()-0.5);
  const name=langName(code)||code;
  return {'題目':'「'+pair[0]+'」用 '+name+'（'+code+'）怎麼說？','選項':picks.map(p=>p[1]),'答案':picks.indexOf(pair),'解析':pair[1]+' 是「'+pair[0]+'」的意思。'};
}

    R.cr=rw.crystal+crE;R.au=rw.gold+auE;R.dm=rw.diamond+dmE;

  }else resetCombo(g);
  saveU(g);
  return R;
}

async function langAskAI(name,code,diffLabel){
  function parse(raw){
    const m=raw.match(/\[[\s\S]*?\]/);if(!m)return null;
    let arr;
    try{arr=JSON.parse(m[0])}catch(e){return null}
    if(!Array.isArray(arr)||!arr[0]||typeof arr[0]['題目']!=='string'||!Array.isArray(arr[0]['選項'])||arr[0]['選項'].length<2)return null;
    const q=arr[0];
    q['選項']=q['選項'].slice(0,4);
    if(typeof q['答案']!=='number'||q['答案']<0||q['答案']>=q['選項'].length)q['答案']=0;
    if(typeof q['解析']!=='string')q['解析']='';
    return q;
  }
  function timed(p,ms){ /* 出題防卡住（v4.0）：45 秒無回應即放棄，改用備援 */
    return new Promise((resolve,reject)=>{
      const t=setTimeout(()=>reject(new Error('timeout')),ms);
      p.then(v=>{clearTimeout(t);resolve(v)},e=>{clearTimeout(t);reject(e)});
    });
  }
  const sys='你是專業的語言教學專家，精通各國語言與人工語言（含克林貢語、精靈語、納美語等）。嚴格按照 JSON 格式回應，不要包含任何額外文字或 markdown。';
  const sys2='你是語言教學專家。嚴格按照 JSON 格式回應。';
  try{
    const prompt='生成 1 道語言學習選擇題：\n學習語言：'+name+'（代碼 '+code+'）\n難度：'+diffLabel+'\n題型：單字／片語 中⇄外配對（題目用繁體中文發問，外文部分用該語言正確的文字）\n要求：\n1. 恰好 4 個選項、只有 1 個正確\n2. 外文拼寫必須正確，含該語言的文字系統\n3. 純文字，禁止圖片、照片、「如圖」、聽力題\n4. 題目與選項避免與常見教材模板完全相同\n5. 本次出題隨機碼：'+Math.random().toString(36).slice(2,9)+'\n\nJSON 格式：[{"題目":"...","選項":["A","B","C","D"],"答案":0,"解析":"..."}]';
    const q=parse(await timed(callGemini(prompt,sys),45000));
    if(q)return q;
  }catch(e){}
  try{ /* 第二輪：簡化 prompt（允許羅馬拼音，小語種成功率大增）*/
    const prompt2='出 1 道語言選擇題（語言：'+name+'，代碼 '+code+'，難度 '+diffLabel+'）：一個中文詞對應四個該語言寫法／拼音，只有一個正確。該語言若無文字或難寫，可用羅馬拼音標示。恰好 4 選項。隨機碼 '+Math.random().toString(36).slice(2,9)+'。\n\nJSON：[{"題目":"...","選項":["A","B","C","D"],"答案":0,"解析":"..."}]';
    const q2=parse(await timed(callGemini(prompt2,sys2),45000));
    if(q2)return q2;
  }catch(e){}
  const fb=LANG_FALLBACK[code]; /* 本地單字庫備援（AI 全失敗/卡住時）*/
  if(fb&&fb.length){
    const idx=Math.floor(Math.random()*fb.length);
    const pair=fb[idx];
    const others=fb.filter((p,i)=>i!==idx&&p[1]!==pair[1]);
    const picks=[pair].concat(others.sort(()=>Math.random()-0.5).slice(0,3)).sort(()=>Math.random()-0.5);
    return {'題目':'「'+pair[0]+'」用 '+name+'（'+code+'）怎麼說？','選項':picks.map(p=>p[1]),'答案':picks.indexOf(pair),'解析':pair[1]+' 是「'+pair[0]+'」的意思。'};
  }
  /* v4.1：AI 失敗時改用每語言專屬語言包（js/langpacks/<code>.js）*/
  const packQ=langQFromPack(code,window.LANG_PACKS&&window.LANG_PACKS[code]);
  if(packQ)return packQ;
  return null;
}

function procMathQ(tier){

const R=(a,b)=>a+((Math.random()*(b-a+1))|0);

const mk=(q,ans,exp)=>{const s=new Set([ans]);while(s.size<4){const c=ans+R(-9,9);if(c!==ans)s.add(c)}const o=[...s].sort(()=>Math.random()-.5);return{'題目':q,'選項':o.map(String),'答案':o.indexOf(ans),'解析':exp}};

if(tier==='困難'){const t=R(1,4);

if(t===1){const s=R(3,9),p=R(2,18);return mk('若 a + b = '+s+'，ab = '+p+'，則 a² + b² = ?',s*s-2*p,'1. (a+b)² = a²+2ab+b²\n2. a²+b² = '+s+'² − 2×'+p+'\n3. = '+(s*s)+' − '+(2*p)+' = '+(s*s-2*p))}

if(t===2){const a=R(2,9),x=R(2,12),b=R(1,20),c=a*x+b;return mk('解方程式：'+a+'x + '+b+' = '+c+'，x = ?',x,'1. '+a+'x = '+c+' − '+b+' = '+(c-b)+'\n2. x = '+(c-b)+' ÷ '+a+'\n3. x = '+x)}

const n=R(2,6),m=R(2,4);return mk('2^'+n+' × 2^'+m+' = 2 的幾次方？',n+m,'1. 同底數相乘、指數相加\n2. '+n+' + '+m+' = '+(n+m)+'\n3. 答案為 2^'+(n+m))}

const t=R(1,4);

if(t===1){const a=R(11,99),b=R(11,99);return mk(a+' + '+b+' = ?',a+b,'1. 直式相加\n2. '+a+' + '+b+'\n3. = '+(a+b))}

function validateQuestion(q){
  if(!q||typeof q!=='object')return{ok:false,msg:'題目格式錯誤'};
  const stem=String(q['題目']||'').trim();if(!stem)return{ok:false,msg:'題目內容為空'};
  const opts=q['選項'];if(!Array.isArray(opts)||opts.length!==4)return{ok:false,msg:'必須恰好 4 個選項'};
  for(let i=0;i<4;i++){if(!String(opts[i]||'').trim())return{ok:false,msg:'選項 '+(i+1)+' 為空'}}
  const seen={};for(let i=0;i<4;i++){const v=String(opts[i]).trim();if(seen[v])return{ok:false,msg:'選項重複：'+v};seen[v]=1}
  const ans=q['答案'];
  if(!(ans===0||ans===1||ans===2||ans===3))return{ok:false,msg:'答案索引必須為 0-3（對應 A-D）'};
  return{ok:true};
}

function parseTxtQuestions(text){
  const t=(text||'').trim().replace(/^\uFEFF/,'');
  if(t.startsWith('[')){try{const j=JSON.parse(t);if(Array.isArray(j))return j}catch(_){}}
  const lines=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const qs=[];let cur=null;
  for(const line of lines){
    let m=line.match(/^(?:題目\s*)?(\d+)[\.、\)]\s*(.*)$/);
    if(m){if(cur&&cur['選項'].length)qs.push(cur);cur={'題目':m[2],'選項':[],'答案':0,'解析':''};continue}
    m=line.match(/^([A-D])[\.、\)：:]?\s*(.*)$/i);
    if(m&&cur){cur['選項'].push(m[2]);continue}
    m=line.match(/^(?:答案|正確答案)[:：]?\s*([A-D1-4])/i);
    if(m&&cur){const a=m[1].toUpperCase();cur['答案']=(a>='1'&&a<='4')?(+a)-1:'ABCD'.indexOf(a);continue}
    if(cur&&line.startsWith('解析'))cur['解析']=line.replace(/^[^:：]*[:：]/,'');
  }
  if(cur&&cur['選項'].length)qs.push(cur);
  return qs;
}

function onStoryPhoto(inp){ /* ☁️ 優先上雲端（原圖、附進度條）；雲端未就緒時退回壓縮內嵌 */

const f=inp.files[0];if(!f)return;

if(f.size>MEDIA_MAX)return toast('⚠️ 檔案請小於 50MB','bad');

const mb=(f.size/1048576).toFixed(1),showProg=f.size>150*1024;

if(showProg)upProg(0,'☁️ 傳送中… 0%（'+mb+'MB）');

const okCb=src=>{if(showProg){upProg(100,'✅ 傳送完成');setTimeout(()=>upProg(null),450)}CUR.storyImg=src;CUR.storyVid=null;const tip=$('#stImgTip');if(tip)tip.textContent='✅ 已選照片';toast('📷 照片已加入，按發布送出')};

cloudUpload(f,okCb,()=>{ /* 退回：壓縮到最長邊 640px 內嵌，避免占滿儲存空間 */

upProg(null);

const r=new FileReader();

r.onload=e=>{const img=new Image();img.onload=()=>{

const mx=640,sc=Math.min(1,mx/Math.max(img.width,img.height));

const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);

cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);

okCb(cv.toDataURL('image/jpeg',.66));

};img.src=e.target.result};

r.readAsDataURL(f);

},pct=>{if(showProg)upProg(pct,'☁️ 傳送中… '+pct+'%（'+mb+'MB）')});

}

function guildPvpChallenge(oppId){

function doGuildPvp(oppId){
  const u=me(),g=u.g;const gd=guildOf(g);if(!gd)return;
  const guilds=get(LS.guilds,[]);const opp=guilds.find(x=>x.id===oppId);if(!opp)return;
  const myPower=power(g);const oppPower=opp.members.reduce((s,m)=>{const mu=get(LS.users,[]).find(y=>y.id===m);return s+(mu&&mu.g?power(mu.g)||0:0)},0)/(opp.members.length||1);
  const winChance=Math.max(0.2,Math.min(0.8,myPower/(myPower+oppPower)));
  const won=Math.random()<winChance;
  if(won){
    g.gold+=200;g.xp+=50;
    while(g.xp>=g.needXp&&g.lv<effMaxLv()){g.xp-=g.needXp;g.lv++;g.needXp=CFG.needXp(g.lv)}
    saveU(u);hud();
    toast('🏆 公會 PVP 勝利！對手：'+esc(opp.name)+'｜🪙+200 ✨+50 XP','success');
  }else{
    toast('💀 公會 PVP 落敗…對手：'+esc(opp.name)+'。下次挑戰！');
  }
  closeModal();vGuild();
}

function mediaUpload(f,done){

const mb=(f.size/1048576).toFixed(1),showProg=f.size>150*1024; /* 小檔秒傳不用顯示進度 */

const prog=pct=>{if(showProg)upProg(pct,'☁️ 傳送中… '+pct+'%（'+mb+'MB）')};

const fin=src=>{if(showProg){upProg(100,'✅ 傳送完成');setTimeout(()=>upProg(null),450)}done(src)};

const supaPath=()=>cloudUpload(f,fin,()=>{ /* 雲端失敗 → 退回 base64 內嵌（舊機制） */

upProg(null);

if(f.size>3*1024*1024)return toast('⚠️ 雲端儲存未就緒，暫時僅支援 3MB 以內（請管理員執行 supabase_storage_setup.sql）','bad');

},prog);

if(/^video\//.test(f.type||'')&&GDRIVE_URL){ /* 📂 影片 → Google Drive，失敗自動改走 Supabase */

if(f.size>GDRIVE_MAX)return toast('⚠️ 影片請小於 30MB','bad');

if(showProg)upProg(0,'☁️ 傳送中… 0%（'+mb+'MB）');

return gdUpload(f,fin,()=>supaPath(),prog);

}

if(f.size>MEDIA_MAX)return toast('⚠️ 檔案請小於 50MB','bad');

function deTex(s){if(typeof s!=='string')return s;let t=s;
t=t.replace(/\\\\(?=[A-Za-z])/g,'\\'); /* JSON 雙反斜線形式（\\\\times）先歸一為單反斜線 */
t=t.replace(/\\left|\\right/g,'');
t=t.replace(/\\text\{([^{}]*)\}/g,'$1');
t=t.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)');
t=t.replace(/\frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)');
t=t.replace(/\\sqrt\{([^{}]*)\}/g,'√($1)');
t=t.replace(/\\times/g,'×');
t=t.replace(/\times/g,'×');
t=t.replace(/\\div/g,'÷').replace(/\\cdot/g,'·').replace(/\\pm/g,'±');
t=t.replace(/\\neq/g,'≠');
t=t.replace(/\neq/g,'≠');
t=t.replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥');
t=t.replace(/\\pi/g,'π').replace(/\\degree/g,'°').replace(/\^\{?\\circ\}?/g,'°');
t=t.replace(/\^\{([^{}]*)\}/g,'^($1)');
t=t.replace(/\\%/g,'%').replace(/\\,|\\;|\\ /g,' ');
t=t.replace(/\$\$?/g,'');
return t}

function parseAiQuestions(text,subject){let cleaned=text.trim();cleaned=cleaned.replace(/```json\s*/gi,'').replace(/```\s*/g,'');cleaned=deTex(cleaned);/* 先轉換 LaTeX，避免 \\times 等被 JSON 轉義成亂碼 */const arrMatch=cleaned.match(/\[[\s\S]*\]/);if(!arrMatch)throw new Error('無法解析 AI 回應，請重試');let questions;try{questions=JSON.parse(arrMatch[0])}catch{throw new Error('JSON 解析失敗，請重試')}if(!Array.isArray(questions))throw new Error('回應格式錯誤');const badWords=['圖','照片','圖片','圖像','如圖','下圖','附圖','看圖'];const listenWords=['聽力','聽','錄音','播放','audio','listening','請聽'];questions=questions.filter(q=>{if(!q['題目']||!q['選項']||!Array.isArray(q['選項'])||q['選項'].length!==4)return false;if(typeof q['答案']!=='number'||q['答案']<0||q['答案']>3)return false;const all=q['題目']+' '+q['選項'].join(' ');for(const w of badWords){if(all.includes(w))return false}for(const w of listenWords){if(all.toLowerCase().includes(w.toLowerCase()))return false}/* 所有科目一律過濾照片與聽力題 */return true});questions.forEach(q=>{q['題目']=deTex(q['題目']);q['選項']=q['選項'].map(deTex);if(q['解析'])q['解析']=deTex(q['解析'])});/* 解析後再清一次殘留符號 */return questions}

function grantExp(g,diff,retry,subj){

if(!rewardOn(g))return 0;

let base=CFG.dRew(diff).exp;if(retry)base=Math.floor(base*1.5);

let m=CFG.lvMult(Math.min(g.lv,CFG.MAX_LV));

if(isEarly())m*=1.05;

/* 收藏與升星加成倍率（單獨計算，供明細顯示；5★覺醒��配最�� +275% = 總倍率 3.75）*/

let cm=1;

const e=effOf(g);cm*=(1+(e.all_exp_bonus||0)+(e.exp_bonus||0));

cm*=(1+0.10*(g.rebirth||0)); /* 🔁 傳承轉生��每次轉生永久全經驗+10% */

const sk={'數學':'math_exp_bonus','英文':'english_exp_bonus','國文':'chinese_exp_bonus','自然':'science_exp_bonus','社會':'social_exp_bonus'}[subj];

if(sk)cm*=(1+(e[sk]||0));

cm*=diff>=50?(1+(e.exp_hard_bonus||0)):(1+(e.exp_easy_bonus||0));

if(g.combo>=10&&e.combo10_exp_mult)cm*=e.combo10_exp_mult;

const baseV=Math.floor(base*m);

const xp=Math.floor(base*m*cm);

window._expCalc={base:baseV,pct:Math.round((cm-1)*100),xp:xp}; /* 供結算畫面顯示公式明細 */

g.xp+=xp;g.quizPts+=Math.floor(xp/5);updMission(g,'exp',xp);

while(g.xp>=g.needXp&&g.lv<effMaxLv()){g.xp-=g.needXp;g.lv++;g.needXp=CFG.needXp(g.lv);toast('🌟 等級提升！Lv.'+g.lv+' 【'+titleOf(g.lv)+'】');showLevelUpFX(g.lv)}

return xp;

}

function grantRew(g,diff,combo){

if(!rewardOn(g))return{crystal:0,gold:0,diamond:0};

const e=effOf(g);

let cr=Math.floor(CFG.dRew(diff).crystal*(1+(e.crystal_bonus||0)));

let au=CFG.dRew(diff).gold+(e.gold_per_correct||0);

au=Math.floor(au*(1+(e.gold_bonus||0)));

if(combo===5)cr+=5;if(combo===10)cr+=15;

if(diff>=50&&e.hard_crystal_bonus)cr+=e.hard_crystal_bonus;

let dm=Math.floor(cr*0.25);g.crystal+=cr;g.gold+=au;g.diamond=(Number(g.diamond)||0)+dm;return{crystal:cr,gold:au,diamond:dm};

}

function addCombo(g){g.combo++;if(g.combo>g.stats.maxCombo)g.stats.maxCombo=g.combo;updMission(g,'combo',g.combo)}

function resetCombo(g){

const e=effOf(g);

if((e.combo_protect||0)>0&&Math.random()<e.combo_protect)return false;

g.combo=0;return true;

}

function comboBonus(g){const e=effOf(g);let b=0;for(const t in CFG.COMBO)if(g.combo>=t)b=CFG.COMBO[t];

if(e.combo_bonus_double)b*=2;if(e.combo_multiplier)b*=e.combo_multiplier;return b+(e.combo_extra||0)}

function rollQuality(g){const e=effOf(g);let r=Math.random(),q;

q=r<.35?'普通':r<.65?'優秀':r<.85?'精良':r<.96?'史詩':'傳說';

if((e.quality_up||0)>0&&Math.random()<e.quality_up){const i=CFG.QUAL.indexOf(q);if(i<4)q=CFG.QUAL[i+1]}

return q;

function rollDrop(g,diff){

if(!rewardOn(g))return null;

if(g._nextDrop){g._nextDrop=false;return genDrop(g)}

const rate=CFG.dropRate(diff)+comboBonus(g)+(isEarly()?.03:0)+(effOf(g).drop_bonus||0)+0.05*(g.rebirth||0); /* 🔁 轉生每次掉落+5% */

return Math.random()<rate?genDrop(g):null;

function genDrop(g){

function doPull(g,pool,randomValue){

const rates={UR:base.UR+bUR,SSR:base.SSR+bSSR,SR:base.SR,R:base.R,N:base.N};

let roll=typeof randomValue==='number'?randomValue:Math.random(),c=0;rar='N';

for(const k of ['UR','SSR','SR','R','N']){c+=rates[k];if(roll<c){rar=k;break}}}

const src=pool==='all'?Object.assign({},CHARS,PETS,ANIME,TEAMMATES):(POOLS[pool]||CHARS);

const names=Object.keys(src).filter(n=>src[n].r===rar);

const name=names.length?pick(names):pick(Object.keys(src));

const cat=CHARS[name]?'character':PETS[name]?'pet':ANIME[name]?'anime':'teammate';

if(['SR','SSR','UR'].includes(rar))gc.sinceSR=0;

if(['SSR','UR'].includes(rar))gc.sinceSSR=0;

if(rar==='UR')gc.sinceUR=0;

const isNew=!g.owned[cat].includes(name);

if(isNew)g.owned[cat].push(name);

return{n:name,r:rar,cat,icon:src[name].icon,isNew,sk:src[name].sk};

}

async function startPkBatch(count){
  const u=me(),g=u.g;
  let wins=0,losses=0,totalXp=0,totalCr=0,totalAu=0,totalHon=0,totalDia=0,played=0;
  let floor=g.arena.floor;
  openModal('<h3 class="mt">⚔️ 批量挑戰中...</h3><div id="pkBatchProg" style="text-align:center;font-size:16px;margin:20px 0;color:var(--gold)">第 0/'+count+' 場</div><div class="bar" style="margin:10px 20px"><i id="pkBatchBar" style="width:0%"></i></div>');
  for(let i=0;i<count;i++){
    if(!canPk(g)){toast('⚠️ 今日 PK 次數已用完，實際挑戰 '+played+' 場','bad');break}
    const opp=arenaOpp(floor);
    const pp=Math.floor(power(g)*(1+(effOf(g).pk_power_bonus||0)));
    let pHp=100+Math.floor(pp/20),oHp=100+Math.floor(opp.pw/20);
    let win=false;
    const e=effOf(g);
    let guaranteed=false;
    if((e.pk_guaranteed_win||0)>0&&g.pk.gwUsed<e.pk_guaranteed_win){g.pk.gwUsed++;guaranteed=true}
    let round=1;
    while(pHp>0&&oHp>0&&round<=50){
      const crit=Math.random()<.2;
      let dmg=Math.floor(pp/8*rnd(.85,1.15))*(crit?1.8:1);
      oHp=Math.max(0,oHp-dmg);
      if(oHp<=0){win=true;break}
      const oCrit=Math.random()<.12;
      let oDmg=Math.floor(opp.pw/8*rnd(.85,1.15))*(oCrit?1.7:1);
      if(guaranteed&&round===1)oDmg=0;
      pHp=Math.max(0,pHp-oDmg);
      if(pHp<=0){win=false;break}
      round++;
    }
    g.pk.today++;played++;
    if(win){
      wins++;g.pk.win++;g.pk.streak++;
      if(g.pk.streak>g.pk.maxStreak)g.pk.maxStreak=g.pk.streak;
      const cr=12+floor*2,au=25+floor*3,xp=40+floor*4,hon=10;
      let dia=0;
      if(!g.pk.firstWin){g.pk.firstWin=true;dia=1}
      floor++;
      if(floor>g.arena.best)g.arena.best=floor;
      if((floor-1)%5===0)dia+=3;
      totalCr+=cr;totalAu+=au;totalXp+=xp;totalHon+=hon;totalDia+=dia;
    }else{
      losses++;g.pk.lose++;g.pk.streak=0;
    }
    const prog=document.getElementById('pkBatchProg');if(prog)prog.textContent='第 '+(i+1)+'/'+count+' 場';
    const bar=document.getElementById('pkBatchBar');if(bar)bar.style.width=((i+1)/count*100)+'%';
    if(count>1&&i<count-1)await new Promise(r=>setTimeout(r,200));
  }
  g.arena.floor=floor;
  g.crystal+=totalCr;g.gold+=totalAu;g.xp+=totalXp;g.honor+=totalHon;g.diamond+=totalDia;
  while(g.xp>=g.needXp&&g.lv<effMaxLv()){g.xp-=g.needXp;g.lv++;g.needXp=CFG.needXp(g.lv)}
  checkTitlesAch(g);saveU(u);hud();
  openModal('<h3 class="mt">⚔️ 批量挑戰結果</h3>'+
    '<div style="text-align:center;font-size:40px;margin:10px 0">'+(wins>losses?'🏆':'😢')+'</div>'+
    '<div style="text-align:center;font-size:16px;margin:10px 0">挑戰 '+played+' 次｜<span style="color:var(--green)">勝 '+wins+'</span> / <span style="color:#ff7b72">敗 '+losses+'</span></div>'+
    '<div class="rwRow"><span class="rwChip">✨ +'+totalXp+' XP</span><span class="rwChip">💠 +'+totalCr+'</span><span class="rwChip">🪙 +'+totalAu+'</span><span class="rwChip">🏅 +'+totalHon+'</span>'+(totalDia?'<span class="rwChip">💎 +'+totalDia+'</span>':'')+'</div>'+
    '<div style="text-align:center;font-size:13px;color:var(--mut);margin:10px 0">當前層數：第 '+g.arena.floor+' 層｜歷史最佳：第 '+g.arena.best+' 層</div>'+
    '<div class="mBtns"><button class="btn" onclick="closeModal();vPK()">返回</button></div>');
}

function captureTerr(g,key,ok){

if(g.territory.owned[key])return{ok:false,msg:'已占领過',rw:null};

if(!ok)return{ok:false,msg:'答錯！領土守衛擋下了進攻',rw:null};

g.territory.owned[key]={t:Date.now()};

const subj=key.split('|')[0];

const tname=key.split('|')[1];

const isBoss=tname.includes('👑');

const count=Object.keys(g.territory.owned).length;

const tt=(TERR_MAP[subj]&&TERR_MAP[subj].t.find(x=>x.n===tname))||{d:1};

const lvl=tt.d||1;

const stageNum=+(String(tname).split('·')[1])||1; /* 關卡序號 1~100：越後面關卡獎勵越多、完全沒有上限 */

const tgt=g.territory.target;

let x2=1;if(tgt&&tgt.subj===subj&&tname===tgt.name)x2=2;

const bossMul=isBoss?3:1; /* 頭目關（每 10 關）額外 3 倍 */

const sc=(1+stageNum*0.14+count*0.02)*x2*bossMul; /* 成長係數＝關卡×0.14＋占領數×0.02，再乘目標加倍與頭目倍率，無上限 */

const R=(base,per)=>Math.max(1,Math.floor((base+stageNum*per)*sc)); /* 各物資：底值＋關卡成長，再乘成長係數 */

const d=Math.max(1,Math.floor((isBoss?8:2)*(1+stageNum*0.06)*x2)); /* 鑽石隨關卡成長 */

const au=Math.floor((30+lvl*4+stageNum*8)*sc); /* 金幣隨關卡成長 */

const mats={ /* 全物資獎勵，皆隨關卡成長且無上限 */

crystal:R(10,0.6),

starlight:R(2,0.12),

ironOre:R(2,0.14),

enhStone:R(2,0.12),

labMat:R(1,0.1),

honor:Math.max(1,Math.floor((1+stageNum*0.08)*sc))

};

g.diamond+=d;g.gold+=au;g.crystal+=mats.crystal;g.starlight+=mats.starlight;g.ironOre+=mats.ironOre;g.enhStone+=mats.enhStone;g.labMat+=mats.labMat;g.honor+=mats.honor;

return{ok:true,msg:'占领成功！'+tname,rw:Object.assign({d,au},mats),total:count};

}

function refreshShop(){

g.diamond-=cost;s.refreshes++;

const pool=SHOP_POOL.slice();const items=[];

while(items.length<8&&pool.length){const it=JSON.parse(JSON.stringify(pool.splice((Math.random()*pool.length)|0,1)[0]));

it.disc=Math.random()<.3?(.6+Math.random()*.3):1;it.hot=Math.random()<.25;items.push(it)}

s.items=items;s.bought=[];

saveU(u);hud();toast('🔄 商店已刷新！');vShopV();

}

function buyIt(i){

if(s.bought.includes(i))return toast('已購買過','bad');

const it=s.items[i];const price=Math.max(1,Math.round(it.p*it.disc));

if(g[it.c]<price)return toast((it.c==='gold'?'🪙':it.c==='diamond'?'💎':'💠')+' 不足','bad');

g[it.c]-=price;

if(it.ty==='mat')g[it.k]+=it.a;else if(it.ty==='cur')g[it.k]+=it.a;

else if(it.ty==='exp'){g.xp+=it.a;(()=>{const _ol=g.lv;while(g.xp>=g.needXp&&g.lv<effMaxLv()){g.xp-=g.needXp;g.lv++;g.needXp=CFG.needXp(g.lv)}if(g.lv>_ol)showLevelUpFX(g.lv)})()}

else if(it.ty==='title'){if(!g.titles.includes('shop'))g.titles.push('shop');toast('🎖 獲得稱號「商店常客」')}

else if(it.ty==='shard'){const cat=pick(['character','pet','anime']);const src=POOLS[cat];const n=pick(Object.keys(src));

if(!g.owned[cat].includes(n))g.owned[cat].push(n);toast('🧩 獲得角色：'+n)}

function doForge(id){

for(const k in r.mats){if((Number(g[k])||0)<Number(r.mats[k]))return toast('⚠️ 材料不足','bad')}

for(const k in r.mats){g[k]=Number(g[k])-Number(r.mats[k])}

g.forgeCount++;updMission(g,'forge',1);

const anvil=$('#anvil');if(anvil){anvil.classList.add('strike');

for(let i=0;i<6;i++){const sp=document.createElement('span');sp.className='sparkFx';sp.textContent='✨';

sp.style.left='50%';sp.style.top='120px';sp.style.setProperty('--dx',rnd(-60,60)+'px');sp.style.setProperty('--dy',rnd(-70,-20)+'px');

$('#view').appendChild(sp);setTimeout(()=>sp.remove(),700)}

setTimeout(()=>anvil.classList.remove('strike'),300)}

setTimeout(()=>{

if(Math.random()<r.rate){

const tot=Object.values(r.qw).reduce((a,b)=>a+b,0);let roll=Math.random()*tot,q='普通',c=0;

for(const k in r.qw){c+=r.qw[k];if(roll<c){q=k;break}}

const name=pick(r.pool);

const forged={n:q+name,q,lv:0,slot:r.slot};g.weapons.push(forged);const ed=eqGet();ed.owned=ed.owned||[];ed.owned.push({id:'forge'+Date.now()+Math.random().toString(36).slice(2,6),name:q+name,rarity:q,slot:r.slot,level:0,maxLevel:q==='∞'?150:100,mainAttr:EQ_MAIN_ATTR[r.slot]||'戰力',mainValue:1,subStats:[]});eqSet(ed);

saveU(u);hud();toast('⚒️ 鍛造成功！獲得 '+q+name+'（'+q+'品質）');

floatTxt('⚒️ '+q,'good',anvil);

}else{

saveU(u);hud();toast('💥 鍛造失敗...','bad');

}

vForge();

},400);

}

function batchEnh(){

const u=me(),g=u.g;

if(!g.weapons.length)return toast('🎒 背包沒有裝備','bad');

let ok=0,fail=0,used=0;

for(const w of g.weapons){

const lv=w.lv||0;if(lv>=15)continue;

const cost=CFG.ENH.cost(lv);

if(Number(g.enhStone)<cost)break;

g.enhStone=Number(g.enhStone)-cost;used+=cost;

g.stats.enhance=(g.stats.enhance||0)+1;updMission(g,'enhance',1);

const rate=CFG.ENH.rate[lv]+(effOf(g).enhance_bonus||0);

if(Math.random()<rate){w.lv=lv+1;ok++}

else{const pen=CFG.ENH.pen(lv);w.lv=Math.max(0,lv-pen);fail++}

}

if(!used)return toast('🔩 強化石不足或裝備皆已滿級','bad');

saveU(u);hud();toast('⚒️ 批量強化完成：成功 '+ok+'｜失敗 '+fail+'（耗 🔩'+used+'）');vBag();

}

function enh(i,mode){

const u=me(),g=u.g;const w=g.weapons[i];if(!w)return;

const lv=w.lv||0;if(lv>=15)return toast('已達最高 +15','bad');

const cost=CFG.ENH.cost(lv);

if(Number(g.enhStone)<cost)return toast('🔩 強化石不足（需 '+cost+'）','bad');

if(mode===1&&Number(g.protect)<1)return toast('🛡️ 保護卷軸不足','bad');

if(mode===2&&Number(g.shield)<1)return toast('🧿 防爆盾不足','bad');

g.enhStone=Number(g.enhStone)-cost;if(mode===1)g.protect--;if(mode===2)g.shield--;

g.stats.enhance=(g.stats.enhance||0)+1;updMission(g,'enhance',1);

let rate=CFG.ENH.rate[lv]+(effOf(g).enhance_bonus||0);

if(Math.random()<rate){w.lv=lv+1;toast('✅ 強化成功！+'+w.lv+'（⚡+'+(w.lv*8)+'）');_enhResult='ok'}

else{const pen=CFG.ENH.pen(lv);

if(pen>0&&mode!==1){if(mode===2)toast('💥 強化失敗！防爆盾保住等級');else{w.lv=Math.max(0,lv-pen);toast('💥 強化失敗！-'+pen+' 級','bad')}_enhResult='no'}

else{toast('💥 強化失敗（無懲罰）','bad');_enhResult='no'}}

saveU(u);hud();vBag();if(_enhResult){setTimeout(()=>{const card=document.querySelector('.upType.enh');if(card){const p=card.closest('.panel2');if(p){p.classList.add(_enhResult==='ok'?'enhOk':'enhNo');setTimeout(()=>p.classList.remove('enhOk','enhNo'),700)}}},50);_enhResult=null}

}

function proposeTrade(fid){

function acceptTrade(tid){

const u=me(),g=u.g;

const trades=get(LS.trades,[]);const t=trades.find(x=>x.id===tid);

if(!t||t.status!=='pending')return;

/* 買方：檢查金幣 */

if(Number(g.gold)<t.price)return toast('🪙 金幣不足（需 🪙'+t.price+'）','bad');

/* 賣方：檢查裝備是否還在 */

const seller=get(LS.users,[]).find(x=>x.id===t.from);

if(!seller||!seller.g)return toast('⚠️ 賣家不存在','bad');

const sw=seller.g.weapons[t.wi];

if(!sw||sw.n!==t.itemData.n||(sw.lv||0)!==(t.itemData.lv||0))return toast('⚠️ 該裝備已不存在或已變更','bad');

/* 執行交易：買方付錢收裝備，賣方收錢失去裝備 */

g.gold=Number(g.gold)-t.price;

g.weapons.push(JSON.parse(JSON.stringify(t.itemData)));

seller.g.weapons.splice(t.wi,1);

seller.g.gold=(Number(seller.g.gold)||0)+t.price;

t.status='accepted';

set(LS.trades,trades);

saveU(u);saveU(seller);hud();

toast('✅ 交易完成！獲得 '+t.itemName+'（付出 🪙'+t.price+'）');vFriends();

}

function hwShuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

function hwRng(seed){let s=seed>>>0;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hwVariant(h,u){ /* 以「學生+作業」為種子，產生固定變體：題序、選項排列、整數選項平移 */
  const rng=hwRng(hwSeed((u.username||u.id||'')+'|'+h.id));
  const order=hwShuffle(h.questions.map((q,i)=>i),rng);
  const opts={},shift={};
  h.questions.forEach(q=>{
    const n=(q['選項']||[]).length;
    opts[q.id]=hwShuffle([...Array(n).keys()],rng);
    const nums=(q['選項']||[]).map(o=>/^-?\d+$/.test(String(o).trim())?parseInt(String(o).trim(),10):null);
    if(nums.length&&nums.every(x=>x!==null)){const off=Math.floor(rng()*21)-10;if(off!==0)shift[q.id]=off;}
  });

}

function loadMusicList(cb){if(!WTOKEN){if(cb)cb([]);return}fetch(SUPA_URL+'/rest/v1/media/music',{headers:{'x-adv9-token':WTOKEN}}).then(r=>r.ok?r.json():[]).then(l=>{MUSIC.list=l||[];if(cb)cb(l||[])}).catch(()=>{MUSIC.list=[];if(cb)cb([])})}
function playMusic(){if(!MUSIC.audio||!MUSIC.list.length)return;const f=MUSIC.list[MUSIC.idx];if(!f)return;MUSIC.audio.src=SUPA_URL+'/storage/v1/object/public/media/music/'+encodeURIComponent(f);MUSIC.audio.play().catch(()=>{});saveMusicPref()}
function musicPlay(){musicInit();if(MUSIC.list.length===0){loadMusicList(()=>{if(MUSIC.list.length){if(MUSIC.idx<0)MUSIC.idx=0;playMusic();toast('🎵 開始播放：'+MUSIC.list[MUSIC.idx])}else toast('⚠️ media/music/ 尚無音樂檔，請老師上傳後再試','bad')});return}if(MUSIC.idx<0)MUSIC.idx=0;playMusic();toast('🎵 開始播放：'+MUSIC.list[MUSIC.idx])}
function musicStop(){if(MUSIC.audio){MUSIC.audio.pause();MUSIC.audio.currentTime=0}MUSIC.idx=-1;saveMusicPref();toast('⏹ 音樂已停止')}
function musicNext(){if(!MUSIC.list.length){loadMusicList(musicNext);return}MUSIC.idx=(MUSIC.idx+1)%MUSIC.list.length;playMusic();toast('🎵 '+MUSIC.list[MUSIC.idx])}
function musicPrev(){if(!MUSIC.list.length){loadMusicList(musicPrev);return}MUSIC.idx=(MUSIC.idx-1+MUSIC.list.length)%MUSIC.list.length;playMusic();toast('🎵 '+MUSIC.list[MUSIC.idx])}

/* 題目驗證：確保每題都有完整 4 選項、無重複、且答案索引有效（0-3 對應 A-D）*/
/* 純文字題目解析：支援 JSON 陣列（AI 格式）或逐題文字格式（同 Word 解析規則）*/
/* 匯入題目（docx/txt 通用）：逐題驗證，回報略過的壞題 */
function hwQsFileUp(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const log=document.getElementById('hwQsImportLog');if(log)log.textContent='⏳ 解析 '+f.name+' ...';
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='doc'){if(log)log.textContent='⚠️ 舊版 .doc 請先用 Word「另存新檔」存成 .docx 或 .txt 再上傳';return}
  if(ext==='txt'){const rd=new FileReader();rd.onload=e=>{importQuestions(parseTxtQuestions(String(e.target.result||'')),log)};rd.readAsText(f,'utf-8');return}
  const rd=new FileReader();rd.onload=async e=>{
    try{
      const resp=await fetch(SUPA_URL+'/rest/v1/docx_questions',{method:'POST',headers:supaHeaders(),body:e.target.result});
      const txt=await resp.text();
      if(!resp.ok)return log?log.textContent='⚠️ 解析失敗（HTTP '+resp.status+'）：'+txt:null;
      let qs;try{qs=JSON.parse(txt)}catch(_){return log?log.textContent='⚠️ 伺服器回應無法解析':null}
      importQuestions(qs,log);
    }catch(err){if(log)log.textContent='⚠️ 上傳失敗：'+err.message}
  };
  rd.readAsArrayBuffer(f);
}

function hwWeakness(id){

  const subs=get(LS.sub,[]).filter(s=>s.hwId===id);
  const us=get(LS.users,[]);
  const stats=h.questions.map(q=>{
    const wrong=subs.filter(s=>s.answers[q.id]==null||s.answers[q.id]!==q['答案']);
    return{q,wrong};
  }).sort((a,b)=>b.wrong.length-a.wrong.length);
  openModal('<h3 class="mt">📊 弱點分析：'+esc(h.title)+'</h3>'+
    '<div style="font-size:12px;color:var(--mut);margin-bottom:8px">已提交 '+subs.length+' 人 · 每題錯誤人數（由高到低）</div>'+

      '<div style="font-size:11.5px;color:'+(s.wrong.length?'#ff8a80':'var(--green)')+'">錯 '+s.wrong.length+'/'+subs.length+' 人'+(s.wrong.length?' · '+s.wrong.slice(0,3).map(w=>{const st=us.find(x=>x.id===w.studentId);return st?esc(st.name):'?'}).join('、')+(s.wrong.length>3?' 等':'')+'':'')+'</div></div>').join('')+
    '</div>'+
    '<div style="margin-top:10px"><button class="btn teal" onclick="hwAiEval(\''+id+'\')">🤖 AI 快速評估</button><button class="btn ghost" onclick="closeModal()">關閉</button></div>'+
    '<div id="hwAiOut" style="margin-top:10px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;max-height:26vh;overflow-y:auto"></div>');
}
async function hwAiEval(id){
  const out=document.getElementById('hwAiOut');if(!out)return;
  out.textContent='🤖 AI 分析中...';
  try{
    const h=get(LS.hw,[]).find(x=>x.id===id);
    const subs=get(LS.sub,[]).filter(s=>s.hwId===id);
    if(!subs.length){out.textContent='尚無人提交，無法分析';return}
    const wrongByQ=h.questions.map(q=>({
      題目:String(q['題目']||'').slice(0,80),
      錯誤人數:subs.filter(s=>s.answers[q.id]==null||s.answers[q.id]!==q['答案']).length,
      解析:(q['解析']||'').slice(0,80)
    })).sort((a,b)=>b.錯誤人數-a.錯誤人數).slice(0,8);
    const prompt='以下是一份國中班級作業的每題錯誤人數統計（共 '+subs.length+' 人提交）：\n'+JSON.stringify(wrongByQ,null,2)+'\n請用繁體中文簡潔分析：1) 全班最弱的 1-2 個概念 2) 可能原因 3) 給老師 2-3 條具體教學建議。';
    const txt=await callAI(prompt,'你是一位有 15 年經驗的國中教師與試題分析專家。');
    out.textContent=txt;
  }catch(e){out.textContent='⚠️ '+e.message}
}

function stuDetail(id,fMode,fSubj){

const s=get(LS.users,[]).find(x=>x.id===id);if(!s)return;

const subjs=['全部'].concat([...new Set(all.map(a=>a.sub).filter(Boolean))]);

const log=all.filter(a=>(fMode==='全部'||a.mode===fMode)&&(fSubj==='全部'||a.sub===fSubj));

window._alogView=log; /* 供計算機過程彈窗讀取 */

const avg=log.length?(log.reduce((a,b)=>a+(b.sec||0),0)/log.length).toFixed(1):'—';

const acc=g.stats&&g.stats.total?Math.round(g.stats.correct/g.stats.total*100):0;

}

function eqSubCount(rarity){
  if(rarity==='R'||rarity==='E')return 1;if(rarity==='A'||rarity==='S')return 2;
  if(rarity==='SS'||rarity==='SSS')return 3;return 4;
}

function eqSubValue(rarity,stat){
  const base={'暴擊':.8,'暴傷':1.2,'冷卻':.6,'減傷':.7,'運氣':.5,'生命':15,'防禦':.8}[stat]||1;
  let mult={R:1,E:1.2,A:1.4,S:1.6,SS:1.8,SSS:2,Z:2.5,ZZ:3,ZZZ:3.5,'∞':5}[rarity]||1;
  if(rarity==='∞')mult*=1.5;
  return Math.round(base*mult*100)/100;
}

function _dGetForUser(uid){
  const all=get(LS.dolls,{});
  return all[uid]||{owned:[]};

function _dSetForUser(uid,d){

/* 遷移：若 LS.dolls 是老格式（{owned:[],shop:[]}）→ 搬到新格式 */
(function migrateDolls(){
  const raw=localStorage.getItem(LS.dolls);
  if(!raw)return;
  try{
    const obj=JSON.parse(raw);
    if(Array.isArray(obj)){
      // 老格式：直接是 owned 陣列，拆給當前登入者
      const u=me();
      if(u){
        const perUser={owned:obj,shop:[]};
        _dSetForUser(u.id,perUser);
      }
      localStorage.removeItem(LS.dolls);
      toast('🔄 娃娃資料已遷移至新格式');
    }
  }catch(e){}
})();
