<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adv9 · 模組化入口</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2733; --mut:#6b7280;
    --gold:#c79a3a; --gold2:#e0b253; --teal:#1f9e8f; --red:#d9534f; --green:#2e9e5b;
    --line:#e3e6ea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(90deg,#fff,#f0f2f5);border-bottom:1px solid var(--line);
         padding:12px 18px;display:flex;align-items:center;gap:10px}
  header .logo{font-size:20px;font-weight:900;color:var(--gold)}
  header .sub{font-size:12px;color:var(--mut)}
  nav{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
  .navbtn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;
          font-size:14px;color:var(--ink);transition:.15s}
  .navbtn:hover{border-color:var(--gold);transform:translateY(-1px)}
  .navbtn.active{background:var(--gold);color:#fff;border-color:var(--gold)}
  main{padding:18px;max-width:880px;margin:0 auto}
  .welcome{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;line-height:1.8;color:var(--mut)}
  .welcome b{color:var(--gold2)}
  .loading,.err{padding:30px;text-align:center;color:var(--mut)}
  .err{color:var(--red)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .vt{font-size:17px;font-weight:800;margin:0 0 12px;color:var(--ink)}
  .vsub{font-size:12px;color:var(--mut);font-weight:400}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;background:var(--gold);color:#fff;font-weight:700}
  .btn:hover{filter:brightness(1.05)}
  .btn.big{width:100%;padding:14px;font-size:16px;margin-top:12px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .pick{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:#fff;transition:.15s}
  .pick:hover{border-color:var(--gold)}
  .pick.sel{border-color:var(--gold);background:#fff8e8}
  .pick .em{font-size:26px}
  .pick .nm{font-size:13px;margin-top:4px}
  input[type=range]{width:100%}
  .chip{display:inline-block;background:#eef1f4;border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
  .ok{color:var(--green)} .bad{color:var(--red)}
  .loot{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px;background:#fff}
  .core-toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
              background:#1f2733;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;z-index:99;font-size:14px}
  .core-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .core-toast.bad{background:#d9534f}
  .muted{color:var(--mut);font-size:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
  <header>
    <span class="logo">⚔️ adv9</span>
    <span class="sub">模組化入口 · 進入功能才載入該功能程式與所需 API</span>
  </header>
  <nav id="nav"></nav>
  <main id="view">
    <div class="welcome">
      上方選單的每一項都是一個 <b>獨立功能套件</b>。<br>
      點擊前，該功能的 JS 根本不會下載、不會執行——這就是「<b>html 只跑當前需要的 html</b>」。<br>
      例如進入 <b>修鍊場</b>，只會載入 <code>features/cultivate.js</code> 並呼叫 <b>C++ 計算微服務</b>（模擬／掉落）；其餘功能的程式碼與 API 完全不碰。
    </div>
  </main>

  <script src="core.js"></script>
  <script>
    /* 導覽：每個項目對應 features/<key>.js，點擊才載入 */
    CORE.nav([
      { key: "cultivate", icon: "⚔️", label: "修鍊場" },
      { key: "status",   icon: "📊", label: "服務狀態" }
    ], "view");
  </script>
</body>
</html>
