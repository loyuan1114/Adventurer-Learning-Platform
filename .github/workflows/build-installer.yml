name: Build Installer

on:
  push:
    paths:
      - 'installer/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: adv9-installer-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: adv9-installer-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: adv9-installer-mac-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: adv9-installer-mac-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux musl tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        working-directory: installer
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cp installer/target/${{ matrix.target }}/release/adv9-installer.exe ${{ matrix.artifact }}

      - name: Rename binary (non-Windows)
        if: matrix.os != 'windows-latest'
        run: cp installer/target/${{ matrix.target }}/release/adv9-installer ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
