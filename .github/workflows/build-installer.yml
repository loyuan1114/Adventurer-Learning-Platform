name: Build Installer

on:
  push:
    paths:
      - 'installer/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: adv9-installer-windows-x64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: adv9-installer-windows-x86.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: adv9-installer-windows-arm64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: adv9-installer-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: adv9-installer-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: adv9-installer-mac-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: adv9-installer-mac-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64
          fi

      - name: Install Windows cross targets
        if: matrix.os == 'windows-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (cross-compile)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: installer
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_DIR: /usr
          OPENSSL_INCLUDE_DIR: /usr/aarch64-linux-gnu/include
          OPENSSL_LIB_DIR: /usr/aarch64-linux-gnu/lib

      - name: Build (native)
        if: matrix.os != 'ubuntu-latest' || matrix.target != 'aarch64-unknown-linux-gnu'
        working-directory: installer
        run: cargo build --release --target ${{ matrix.target }}
        env:
          OPENSSL_DIR: /usr
          OPENSSL_INCLUDE_DIR: /usr/include
          OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cp installer/target/${{ matrix.target }}/release/adv9-installer.exe ${{ matrix.artifact }}

      - name: Rename binary (non-Windows)
        if: matrix.os != 'windows-latest'
        run: cp installer/target/${{ matrix.target }}/release/adv9-installer ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
